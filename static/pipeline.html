<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard Factory Pipeline</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,400;0,600;0,700;0,800;1,800&display=swap" rel="stylesheet">
<style>
  :root {
    /* Own palette, inspired by the Bayer brand (blue + green). Not official Bayer colours. */
    --navy: #0B2D3E; --brand-blue: #0068A8; --brand-green: #5DBB46; --bg: #F4F8FB; --teal: #0B2D3E; --cta: #C8003F;
    --card: #fff; --ink: #0B2D3E; --muted: #35566A; --line: #D5E2EB;
    --user: #00B3B8; --ai: #4DB8F5; --code: #5DBB46; --state: #0068A8;
    --ok: #1a7f46; --warn: #0068A8; --alert: #C8003F;
    --u: clamp(13px, 1vw, 22px);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: "Figtree", system-ui, "Segoe UI", sans-serif; font-size: var(--u); }
  header { background: linear-gradient(120deg, #0B2D3E 0%, #0068A8 60%, #00B3B8 100%); color: #fff; padding: 1.1em 2.4em; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1em; }
  .hnav { display: flex; gap: .6em; flex-wrap: wrap; }
  header h1 { margin: 0; font-size: 1.6em; letter-spacing: -.01em; }
  header a { color: #fff; text-decoration: none; font-weight: 600; background: #ffffff2e; border-radius: 99em; padding: .5em 1.2em; }
  header h1 { font-style: italic; font-weight: 800; }
  .panel h2 { color: var(--teal); font-style: italic; font-weight: 800; }
  main { padding: 1.6em 2.4em 3em; }


  .stepper { display: grid; grid-template-columns: repeat(6, 1fr); gap: .6em; margin-bottom: 1.6em; }
  .step { cursor: pointer; text-align: left; padding: .8em 1.1em; border-radius: 1em; background: var(--card); color: var(--muted); font: inherit; border: .06em solid var(--line); transition: .2s; }
  .step b { display: block; font-size: 1.1em; }
  .step small { color: var(--muted); }
  .step.done { background: var(--navy); border-color: var(--navy); color: #fff; }
  .step.done small { color: #ffffffcc; }
  .step.active { background: #E8F3FA; color: var(--ink); border: .12em solid var(--brand-blue); }
  .step:disabled { cursor: default; opacity: .6; }

  .panel { background: var(--card); border: .06em solid var(--line); border-radius: 1.25em; padding: 1.6em 2em; min-height: 24em; }
  .panel h2 { margin: 0 0 .2em; font-size: 1.8em; }
  .panel h3 { margin: 1.2em 0 .4em; }
  .panel .sub { color: var(--muted); margin-bottom: 1.2em; }
  textarea, input, select { font: inherit; width: 100%; padding: .7em .9em; border: .1em solid var(--line); border-radius: .6em; background: #fff; color: var(--ink); }
  .dd { position: relative; }
  .ddbtn { font: inherit; width: 100%; display: flex; justify-content: space-between; align-items: center; gap: .6em; text-align: left; padding: .7em .9em; border: .1em solid var(--line); border-radius: .6em; background: #fff; color: var(--ink); cursor: pointer; }
  .ddbtn:hover { border-color: var(--brand-blue); } .ddbtn:focus-visible, .ddbtn[aria-expanded="true"] { outline: none; border-color: var(--navy); box-shadow: 0 0 0 .15em #0068A833; }
  .ddlist { position: absolute; z-index: 20; left: 0; right: 0; top: calc(100% + .25em); margin: 0; padding: .3em; list-style: none; max-height: 16em; overflow-y: auto; background: #fff; border: .1em solid var(--line); border-radius: .6em; box-shadow: 0 .5em 1.5em #0b2d3e22; }
  .ddlist[hidden] { display: none; }
  .ddlist li { padding: .55em .7em; border-radius: .4em; cursor: pointer; } .ddlist li:hover, .ddlist li:focus { background: var(--mist); outline: none; } .ddlist li[aria-selected="true"] { font-weight: 800; color: var(--brand-blue); }
  textarea { min-height: 5.5em; font-size: 1.2em; resize: vertical; }
  label { display: block; font-weight: 700; margin: 1em 0 .3em; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 1em; }
  button.act { font: inherit; font-weight: 700; font-size: 1.15em; border: 0; border-radius: .75em; padding: .7em 1.6em; cursor: pointer; color: #fff; background: var(--brand-blue); }
  button.act:disabled { opacity: .5; cursor: wait; }
  a.act.mid { display: inline-block; text-decoration: none; font: inherit; font-weight: 700; font-size: 1.15em; border-radius: .75em; padding: .7em 1.6em; background: #fff; color: var(--brand-blue); border: .12em solid var(--brand-blue); }
  .dlb { font: inherit; font-weight: 700; font-size: .8em; background: #fff; color: var(--brand-blue); border: .1em solid var(--brand-blue); border-radius: .6em; padding: .2em .8em; cursor: pointer; margin-left: .4em; }
  /* The whole row is the click target, not just the little arrow. */
  a.rv { display: grid; grid-template-columns: 1fr auto; gap: .3em 1em; padding: .8em .8em; margin: 0 -.8em; border-bottom: .06em solid var(--line); align-items: center; color: inherit; text-decoration: none; cursor: pointer; border-radius: .6em; }
  a.rv:hover, a.rv:focus-visible { background: var(--mist); outline: none; } a.rv:last-child { border-bottom: 0; }
  .rv small { color: var(--muted); display: block; } .rv .go { color: var(--brand-blue); font-weight: 700; white-space: nowrap; }
  a.act.open { display: inline-block; text-decoration: none; font: inherit; font-weight: 700; font-size: 1.15em; border-radius: .75em; padding: .7em 1.6em; color: #fff; background: var(--cta); }
  button.act.go { background: var(--ok); } button.act.mid { background: #fff; color: var(--brand-blue); border: .12em solid var(--brand-blue); }
  button.act.no { background: #fff; color: var(--alert); border: .12em solid var(--alert); }
  .btns { display: flex; gap: 1em; flex-wrap: wrap; margin: 1.2em 0; }

  .quote { font-size: 1.4em; line-height: 1.4; padding: 1em 1.2em; border-left: .3em solid var(--user); background: #E8F3FA; border-radius: .5em; }
  .q { background: #E8F3FA; border: .12em solid var(--brand-blue); border-radius: .8em; padding: .8em 1.1em; margin-bottom: .6em; font-weight: 700; }
  .blocked { background: #fde4e7; border: .12em solid var(--alert); color: var(--alert); border-radius: .6em; padding: .8em 1.1em; font-weight: 700; margin: 1em 0; }
  .chips { display: flex; flex-wrap: wrap; gap: .5em; align-items: center; }
  .chip { background: #E8F3FA; color: var(--ink); font-weight: 700; padding: .3em .9em; border-radius: 99em; }
  .rule { border: .1em solid var(--brand-blue); color: var(--brand-blue); border-radius: .5em; padding: .2em .7em; font-weight: 600; }
  table { width: 100%; border-collapse: collapse; margin: .6em 0 1em; }
  th, td { text-align: left; padding: .6em .8em; border-bottom: .1em solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-size: .9em; text-transform: uppercase; letter-spacing: .06em; }
  tr.best td { background: #e3f6ea; font-weight: 700; }
  td:last-child:has(.fit), th.num, td.num { text-align: right; white-space: nowrap; }
  .fit { display: inline-block; height: .7em; background: var(--brand-green); border-radius: .4em; vertical-align: middle; margin-right: .5em; }
  ul.ev { margin: 0 0 1em; padding-left: 1.3em; line-height: 1.6; }
  .verdict { display: inline-block; font-size: 2.2em; font-weight: 800; letter-spacing: .06em; color: #fff; padding: .15em .7em; border-radius: .4em; }
  .headline { font-size: 1.35em; margin: .7em 0 1em; line-height: 1.4; }
  ol.actions { line-height: 1.7; font-size: 1.1em; padding-left: 1.3em; }
  details { background: #E8F3FA; border-radius: .6em; padding: .7em 1em; margin-top: 1em; }
  summary { cursor: pointer; font-weight: 700; color: var(--state); }
  .spec { border: .15em dashed var(--brand-blue); border-radius: .9em; padding: 1.2em 1.5em; background: var(--bg); }
  .spec h3 { margin: 0 0 .2em; font-size: 1.4em; }
  .spec .tag { display: inline-block; background: var(--warn); color: #fff; font-weight: 700; font-size: .85em; padding: .15em .8em; border-radius: 99em; vertical-align: middle; margin-left: .6em; }
  .spec .tag.ok { background: var(--ok); }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(11em, 1fr)); gap: .7em; margin: 1em 0; }
  .tiles div { background: #E8F3FA; border-radius: .6em; padding: .8em; font-weight: 700; }
  .tiles small { display: block; color: var(--muted); font-weight: 400; margin-top: .2em; }
  dl { display: grid; grid-template-columns: 11em 1fr; gap: .4em 1em; margin: .8em 0 0; } dt { color: var(--muted); } dd { margin: 0; }
  .status { display: inline-block; font-size: 1.8em; font-weight: 800; color: #fff; padding: .15em .8em; border-radius: .4em; }
  /* Layout from the Claude Design "Dashboard" page */
  .policy { background: #e8f3fa; border-left: .3em solid var(--brand-blue); border-radius: .5em; padding: .7em 1em; margin: .4em 0 1em; line-height: 1.5; }
  .evrow { background: #E8F3FA; border-radius: .75em; padding: .8em 1em; margin-bottom: .6em; line-height: 1.5; }
  .lab2 { font-size: .9em; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 1.2em 0 .6em; }
  .recgrid { display: flex; flex-wrap: wrap; gap: 1.4em; align-items: stretch; }
  .rcard { background: #fff; border: .06em solid var(--line); border-radius: 1.25em; overflow: hidden; min-width: 0; }
  .recgrid .rcard:first-child { flex: 3 1 34em; } .recgrid .side { flex: 2 1 20em; padding: 1.4em 1.6em; }
  .band { padding: 1.4em 1.7em; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: .8em; }
  .prov { background: #fff9e0; border: .12em solid #b58900; border-radius: .6em; padding: .8em 1.1em; margin: .8em 0 1em; line-height: 1.5; } .prov a { color: var(--brand-blue); font-weight: 800; }
  .band.provisional { opacity: .55; filter: saturate(.5); } .band.provisional .big::after { content: " ?"; }
  .band .lab { font-size: .9em; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; }
  .band .big { font-size: 2.8em; font-weight: 800; font-style: italic; line-height: 1.05; }
  .band .req { background: #0B2D3E; color: #fff; border-radius: .9em; padding: .5em 1em; font-weight: 600; }
  .rbody { padding: .4em 1.7em 1.6em; }
  .rbody .headline { font-size: 1.15em; margin: 1.2em 0 .2em; }
  .side .lab2 { margin-top: 0; }
  .barrow { display: grid; grid-template-columns: 7em minmax(0, 1fr) 2em; align-items: center; gap: .8em; margin-bottom: .8em; font-weight: 600; }
  .track { height: 1.1em; border-radius: .6em; background: #E8F3FA; } .track i { display: block; height: 100%; border-radius: .6em; box-sizing: border-box; }
  .small { font-size: .9em; color: var(--muted); }
  table.audit { min-width: 38em; } table.audit th { border-bottom: .12em solid var(--line); }
  .pill { font-weight: 800; padding: .25em .7em; border-radius: 99em; font-size: .85em; white-space: nowrap; }
  .hash { font-family: ui-monospace, monospace; font-size: .85em; color: var(--muted); }
  .badge { display: inline-block; font-weight: 700; padding: .25em .9em; border-radius: 99em; color: #fff; margin-left: .6em; font-size: .85em; }
  .nav { display: flex; justify-content: space-between; margin-top: 1.2em; }
  .nav button { font: inherit; font-weight: 700; padding: .6em 1.4em; border-radius: .6em; border: .1em solid var(--navy); background: #fff; color: var(--navy); cursor: pointer; }
  .nav button.primary { background: var(--brand-blue); border-color: var(--brand-blue); color: #fff; }
  .nav button:disabled { opacity: .35; cursor: default; }
  .note { font-size: .85em; color: var(--muted); text-align: center; margin-top: 1em; }
  @media (max-width: 800px) { .stepper { grid-template-columns: repeat(2, 1fr); } .row { grid-template-columns: 1fr; } dl { grid-template-columns: 1fr; } main, header { padding-inline: 1em; } th, td { padding: .5em .4em; font-size: .85em; } .panel { padding: 1.2em 1em; } }
</style>
</head>
<body>
<header>
  <h1>Analytics Dashboard Factory</h1>
  <nav class="hnav"><a href="/my-dashboards">My dashboards</a><a href="/">← Supply operations overview</a></nav>
</header>
<main>
  <div class="stepper" id="stepper"></div>
  <div class="panel" id="panel"></div>
  <div class="nav"><button id="prev">← Back</button><button id="next" class="primary">Next →</button></div>
  <div class="note">Live: every request, decision and audit entry comes from the recommendation engine. Use ← → keys to move.</div>
</main>
<script>
// Verdict colours from the Claude Design palette: green = less to build, crimson = retire.
const VERDICT = {
  REUSE:       { label: 'Reuse',       bg: '#5DBB46', fg: '#0B2D3E', band: 'linear-gradient(120deg,#5DBB46 0%,#00B3B8 100%)', bfg: '#0B2D3E' },
  EXTEND:      { label: 'Extend',      bg: '#00B3B8', fg: '#0B2D3E', band: 'linear-gradient(120deg,#00B3B8 0%,#4DB8F5 100%)', bfg: '#0B2D3E' },
  CONSOLIDATE: { label: 'Consolidate', bg: '#4DB8F5', fg: '#0B2D3E', band: 'linear-gradient(120deg,#4DB8F5 0%,#0091DF 100%)', bfg: '#0B2D3E' },
  MIGRATE:     { label: 'Migrate',     bg: '#0B2D3E', fg: '#fff',    band: 'linear-gradient(120deg,#0B2D3E 0%,#0068A8 100%)', bfg: '#fff' },
  RETIRE:      { label: 'Retire',      bg: '#C8003F', fg: '#fff',    band: 'linear-gradient(120deg,#C8003F 0%,#E6004D 100%)', bfg: '#fff' },
  NEW_BUILD:   { label: 'Build new',   bg: '#fff',    fg: '#0068A8', band: 'linear-gradient(120deg,#0068A8 0%,#0091DF 100%)', bfg: '#fff', outline: true }
};
// One plain line from the engine's change_policy: what happens to existing assets (non-destructive by default).
function policyLine(cp) {
  if (!cp) return '';
  const names = [...new Set((cp.consult || []).map(c => c.owner).filter(Boolean))], own = names.join(', ');
  if (cp.mode === 'derive') return `New dashboard derived from ${cp.derived_from}. ${cp.derived_from} stays unchanged for its users.${own ? ' Owner told: ' + own + '.' : ''}`;
  if (cp.mode === 'propose') return `Proposal only: ${own || 'the owners'} ${names.length > 1 ? 'are' : 'is'} asked. Nothing is changed without their agreement.`;
  if (cp.mode === 'retire_with_consent' || cp.mode === 'new_asset') return `${own ? 'Owner ' + own + ' is asked' : 'The owner is asked'}; the old asset keeps running until its users have moved.`;
  if (cp.mode === 'reuse_as_is') return `Reused as is: nothing is changed${(cp.unchanged || [])[0] ? ' (' + cp.unchanged[0] + ')' : ''}.`;
  return '';
}
function intentView(it) {
  if (!it || typeof it === 'string') return `<div>${esc(it || '')}</div>`;
  const known = [...(it.products || []), ...(it.markets || []), ...(it.metrics || [])];
  return `<div class="chips">${known.map(x => `<span class="chip">${esc(x)}</span>`).join('') || '<span class="small">Nothing specific yet</span>'}</div>
    ${(it.corrections || []).length ? `<div class="small" style="margin-top:.5em">${it.corrections.map(c => `Read “${esc(c.from)}” as ${esc(c.to)}`).join(' · ')}. Tell us if that is wrong.</div>` : ''}
    ${(it.new_measures || []).length ? `<div class="lab2">No governed KPI exists yet for</div><div class="chips">${it.new_measures.map(x => `<span class="pill" style="background:#fff;color:#0068A8;border:2px solid #0068A8">${esc(x)}</span>`).join('')}</div>` : ''}`;
}
// A RETIRE approval archives an asset; nothing is built, so there is no dashboard to open.
function retirePanel() {
  const s = prop.spec, ns = Array.isArray(s.next_steps) ? s.next_steps : null;
  const todo = ns ? ns.filter(x => x.status === 'todo') : (s.required_actions || []).map(t => ({ text: t })), done = ns ? ns.filter(x => x.status === 'done') : [];
  return `<div class="spec"><h3>Retirement approved</h3>
    <div class="evrow">Asset to archive: <b>${esc(s.target_asset || 'the asset named in the recommendation')}</b></div>
    ${todo.length ? `<div class="lab2">Still to do</div><ol class="actions">${todo.map(a => `<li>${esc(a.text)}${a.who_name ? ' <span class="small">(' + esc(a.who_name) + ')</span>' : ''}</li>`).join('')}</ol>` : ''}
    ${done.length ? `<p class="small" style="margin:.5em 0">Done: ${done.map(a => esc(a.text)).join(' · ')}</p>` : ''}
    <p class="headline">No dashboard is built: the best dashboard is the one you don't build.</p></div>`;
}
// "Needs review": dashboards built through the factory, ordered by what needs attention (engine: /api/lifecycle).
let lifecycle = [];
let pending = [];
function reviewHtml() {
  const rows = lifecycle.filter(x => (x.warnings || []).length || x.state !== 'active').slice(0, 4);
  const queue = pending.slice(0, 4);
  const q = queue.length ? `<h3>Waiting for approval</h3><div class="small">Requests that have a recommendation but no decision yet. An approver can pick one up here.</div>
    ${queue.map(p => `<a class="rv" href="#" onclick="openProposal('${esc(p.proposal_id)}');return false"><span><b>${esc(p.spec.title)}</b><small>asked by ${esc(p.requester)} · ${esc(String(p.created).slice(0, 16).replace('T', ' '))} UTC · ${esc(String(p.recommendation.verdict).replace('_', ' '))}${(p.recommendation.clarify || []).length ? ' · has open questions' : ''}</small></span><span class="go">Open →</span></a>`).join('')}` : '';
  const r = rows.length ? `<h3>Needs review</h3><div class="small">Dashboards approved here, most urgent first. Review period is our assumption, not Bayer policy.</div>
    ${rows.map(x => `<a class="rv" href="/trace/${encodeURIComponent(x.proposal_id)}" target="_blank" rel="noopener"><span><b>${esc(x.title)}</b><small>${esc(x.state)} · review due ${esc(x.review_due)} · ${(x.warnings || []).length} warning${(x.warnings || []).length === 1 ? '' : 's'}${x.warnings?.[0] ? ': ' + esc(x.warnings[0]) : ''}</small></span><span class="go">Trace →</span></a>`).join('')}` : '';
  return q + r;
}
function loadReview() {
  Promise.all([api('/api/lifecycle').catch(() => []), api('/api/proposals').catch(() => [])]).then(([lc, ps]) => {
    lifecycle = lc; allProps = ps.length ? ps : allProps;
    pending = ps.filter(p => p.status === 'pending_approval').sort((a, b) => String(b.created).localeCompare(String(a.created)));
    const el = $('review'); if (el) el.innerHTML = reviewHtml();
  });
}
function openProposal(id) { // an approver picks up a waiting request
  const p = pending.find(x => x.proposal_id === id); if (!p) return;
  prop = p; store.set('dfCurrent', p.proposal_id); pick = {}; request = p.spec.request || ''; audit = null; blockMsg = ''; errMsg = '';
  go((p.recommendation.clarify || []).length ? 1 : 3);
}
// Audit export for a SIEM or an auditor: the same chained entries, as JSON or CSV.
function saveFile(name, text, type) { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000); }
function downloadAudit(kind) {
  if (!audit) return;
  if (kind === 'json') return saveFile(`audit-${prop.proposal_id}.json`, JSON.stringify(audit, null, 2), 'application/json');
  const cell = v => '"' + String(v ?? '').replace(/"/g, '""') + '"', cols = ['seq', 'ts', 'event', 'actor', 'proposal_id', 'prev_hash', 'hash'];
  saveFile(`audit-${prop.proposal_id}.csv`, [cols.join(',') + ',detail', ...audit.entries.map(e => cols.map(c => cell(e[c])).join(',') + ',' + cell(JSON.stringify(e.detail)))].join('\n'), 'text/csv');
}
// Custom dropdown: the whole box opens the list (the native select only opened from its small arrow for some users).
let pick = {}; // chosen owner ids for the approve step; kept across re-renders, reset for each new request
function dd(id, opts, value, placeholder) {
  const cur = opts.find(o => o.v === value);
  return `<div class="dd" id="dd-${id}" data-id="${id}"><input type="hidden" id="${id}" value="${esc(value)}">
    <button type="button" class="ddbtn" aria-haspopup="listbox" aria-expanded="false" aria-labelledby="lbl-${id}" onclick="toggleDd('${id}')"><span>${esc(cur ? cur.t : placeholder)}</span><span aria-hidden="true">▾</span></button>
    <ul class="ddlist" role="listbox" tabindex="-1" hidden>${opts.map(o => `<li role="option" tabindex="-1" data-v="${esc(o.v)}" aria-selected="${o.v === value}" onclick="pickDd('${id}', this.dataset.v)">${esc(o.t)}</li>`).join('')}</ul></div>`;
}
function closeDds(except) { document.querySelectorAll('.dd').forEach(d => { if (d.dataset.id === except) return; d.querySelector('.ddlist').hidden = true; d.querySelector('.ddbtn').setAttribute('aria-expanded', 'false'); }); }
function toggleDd(id) {
  closeDds(id); const d = $('dd-' + id), l = d.querySelector('.ddlist'), open = l.hidden;
  l.hidden = !open; d.querySelector('.ddbtn').setAttribute('aria-expanded', String(open));
  if (open) { const sel = l.querySelector('[aria-selected="true"]') || l.firstElementChild; sel?.scrollIntoView({ block: 'nearest' }); sel?.focus({ preventScroll: true }); }
}
function pickDd(id, v) {
  pick[id] = v; const d = $('dd-' + id), li = [...d.querySelectorAll('li')].find(x => x.dataset.v === v);
  $(id).value = v; d.querySelector('.ddbtn span').textContent = li ? li.textContent : '';
  d.querySelectorAll('li').forEach(x => x.setAttribute('aria-selected', String(x === li)));
  closeDds(); d.querySelector('.ddbtn').focus();
}
addEventListener('click', e => { if (!e.target.closest('.dd')) closeDds(); });
addEventListener('keydown', e => { // arrows, Enter, Escape and type-to-jump inside an open list
  const li = e.target.closest?.('.ddlist li'), d = e.target.closest?.('.dd'); if (!d) return;
  const items = [...d.querySelectorAll('li')], list = d.querySelector('.ddlist');
  if (e.target.classList.contains('ddbtn') && (e.key === 'ArrowDown' || e.key === 'ArrowUp')) { e.preventDefault(); if (list.hidden) toggleDd(d.dataset.id); return; }
  if (!li) return;
  const i = items.indexOf(li);
  if (e.key === 'ArrowDown') { e.preventDefault(); items[Math.min(i + 1, items.length - 1)].focus(); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); items[Math.max(i - 1, 0)].focus(); }
  else if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pickDd(d.dataset.id, li.dataset.v); }
  else if (e.key === 'Escape') { e.preventDefault(); closeDds(); d.querySelector('.ddbtn').focus(); }
  else if (e.key.length === 1) { const hit = items.find(x => x.textContent.toLowerCase().startsWith(e.key.toLowerCase())); hit?.focus(); }
});
function newRequest() { store.del('dfCurrent'); pick = {}; prop = null; request = ''; audit = null; blockMsg = ''; errMsg = ''; go(0); loadReview(); }
const VERBS = { approve: 'Approved', reject: 'Rejected', request_changes: 'Changes requested' };
const evRows = arr => (arr || []).map(e => `<div class="evrow">${esc(e)}</div>`).join('');
const actionPill = ev => { const k = String(ev), s = /reject/.test(k) ? 'background:#C8003F;color:#fff' : /approv/.test(k) ? 'background:#5DBB46;color:#0B2D3E' : /change/.test(k) ? 'background:#fff;color:#0068A8;border:2px solid #0068A8' : 'background:#4DB8F5;color:#0B2D3E';
  return `<span class="pill" style="${s}">${esc(k.replace(/_/g, ' ').toUpperCase())}</span>`; };
const STEPS = [
  { name: 'Ask', sub: 'You describe it', c: 'var(--user)' },
  { name: 'Clarify', sub: 'What we understood', c: 'var(--ai)' },
  { name: 'Evidence', sub: 'Does it already exist?', c: 'var(--code)' },
  { name: 'Recommend', sub: 'Reuse before build', c: 'var(--ai)' },
  { name: 'Preview', sub: 'The draft spec', c: 'var(--code)' },
  { name: 'Approve', sub: 'A human decides', c: 'var(--user)' }
];
// Small helpers for localStorage (may be blocked): the requester's name (shared with My dashboards) and the current proposal.
const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }, del(k) { try { localStorage.removeItem(k); } catch (e) {} } };
let cur = 0, request = '', requester = store.get('dfName') || 'Jessica', prop = null, allProps = [], approvers = [], audit = null, busy = false, errMsg = '', blockMsg = '';
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const reached = () => prop ? STEPS.length - 1 : 0;

async function api(path, opts) {
  const r = await fetch(path, opts && { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(opts) });
  const body = await r.json().catch(() => ({}));
  if (!r.ok) throw Object.assign(new Error(body.detail || ('Server answered ' + r.status)), { status: r.status });
  return body;
}

function render() {
  $('stepper').innerHTML = STEPS.map((s, i) => `<button class="step ${i === cur ? 'active' : i < cur ? 'done' : ''}" style="--c:${s.c}" ${i > reached() ? 'disabled' : ''} onclick="go(${i})"><b>${i + 1}. ${s.name}</b><small>${s.sub}</small></button>`).join('');
  $('panel').innerHTML = VIEWS[cur]();
  $('prev').disabled = cur === 0; $('next').disabled = cur >= reached();
}
const go = i => { if (i > reached()) return; cur = Math.max(0, Math.min(STEPS.length - 1, i)); render(); if (cur === 5) loadAudit(); };
$('prev').onclick = () => go(cur - 1); $('next').onclick = () => go(cur + 1);
addEventListener('keydown', e => { if (e.target.matches('textarea,input,select') || e.target.closest('.dd')) return; if (e.key === 'ArrowRight') go(cur + 1); if (e.key === 'ArrowLeft') go(cur - 1); });

async function ask(extra) {
  const ta = $('req'); if (ta) request = ta.value;
  const who = $('who'); if (who) { requester = who.value || 'Jessica'; store.set('dfName', who.value.trim()); }
  if (!request.trim()) { errMsg = 'Please write your request first.'; render(); return; }
  // A clarifying answer is sent as its own field; the engine rebuilds the request (never append it ourselves).
  const answering = extra && extra.trim() && prop ? { answer: extra.trim(), previous_proposal_id: prop.proposal_id } : {};
  busy = true; errMsg = ''; blockMsg = ''; render();
  try {
    prop = await api('/api/proposals', { text: request, requester, use_llm: true, ...answering }); pick = {}; store.set('dfCurrent', prop.proposal_id);
    request = prop.recommendation.intent?.raw || request; // shows the rebuilt text, e.g. "Net sales for Kerendia in Germany"
    audit = null; allProps = await api('/api/proposals').catch(() => [prop]); busy = false; go(prop.recommendation.clarify?.length ? 1 : 3);
  } catch (e) { busy = false; errMsg = 'Could not reach the recommendation engine: ' + e.message; render(); }
}

async function decide(decision) {
  const body = { proposal_id: prop.proposal_id, decision, approver_id: $('apr').value, comment: $('cmt').value, accountable_owner_id: $('own').value || null };
  blockMsg = ''; busy = true;
  try { prop = await api('/api/approve', body); store.set('dfCurrent', prop.proposal_id); } catch (e) { blockMsg = e.message; }
  busy = false; await loadAudit();
}

async function loadAudit() {
  try { if (!approvers.length) approvers = await api('/api/approvers'); audit = await api('/api/audit?proposal_id=' + prop.proposal_id); } catch (e) { audit = null; }
  if (cur === 5) render();
}

const chips = (arr, cls) => `<div class="chips">${arr.map(x => `<span class="${cls}">${esc(x)}</span>`).join('')}</div>`;
const ruleChips = r => chips(Object.entries(r || {}).map(([k, v]) => `${k} ${v}`), 'rule');

const VIEWS = [
  () => `<h2>1. Ask</h2><div class="sub">Anyone can ask in their own words. No technical terms needed.</div>
    <label for="req">What would you like to see?</label>
    <textarea id="req" placeholder="e.g. A dashboard of net sales and forecast variance for Kerendia">${esc(request)}</textarea>
    <div class="row"><div><label for="who">Your name</label><input id="who" value="${esc(requester)}" oninput="requester = this.value || 'Jessica'; store.set('dfName', this.value.trim())"></div><div></div></div>
    ${errMsg ? `<div class="blocked">${esc(errMsg)}</div>` : ''}
    <div class="btns"><button class="act" ${busy ? 'disabled' : ''} onclick="ask()">${busy ? 'Thinking…' : 'Ask the factory →'}</button></div>
    <div id="review">${reviewHtml()}</div>`,

  () => { const r = prop.recommendation, cl = r.clarify || [];
    return `<h2>2. Clarify</h2><div class="sub">The factory repeats back what it understood, and asks when something is unclear.</div>
    <div class="quote">“${esc(request)}”</div>
    ${cl.length ? `<h3>Before this can go further, we need to know:</h3>${cl.map(q => `<div class="q">${esc(q)}</div>`).join('')}
      <div class="blocked">Approval is blocked until these questions are answered.</div>
      <label for="more">Your answer</label><textarea id="more" placeholder="Add details here"></textarea>
      <div class="btns"><button class="act" ${busy ? 'disabled' : ''} onclick="ask($('more').value)">${busy ? 'Thinking…' : 'Answer and ask again'}</button></div>`
      : `<h3>Understood, no questions needed.</h3>`}
    <h3>I understood:</h3>${intentView(r.intent)}`; },

  () => { const r = prop.recommendation;
    return `<h2>3. Evidence</h2><div class="sub">Before building anything, we check what Bayer already has. Fixed code, so the same question always gives the same answer.</div>
    <table><tr><th>Existing dashboard</th><th>Tool</th><th>Endorsed</th><th class="num">How well it fits</th></tr>
    ${(r.candidates || []).map((c, i) => `<tr class="${i === 0 ? 'best' : ''}"><td>${esc(c.name)}<br><small style="color:var(--muted)">${esc(c.asset_id)} · ${esc(c.status)}</small></td><td>${esc(c.platform)}</td><td>${esc(c.endorsement)}</td><td><span class="fit" style="width:${c.fit * 4}em"></span>${Math.round(c.fit * 100)}%</td></tr>`).join('')}</table>
    <h3>What we found</h3>${evRows(r.evidence) || '<div class="evrow">No existing dashboard matches.</div>'}
    <h3>KPIs asked for</h3><table><tr><th>KPI</th><th>Approved definition</th><th>Owner</th><th class="num">Conflicts</th></tr>
    ${(r.kpis || []).map(k => `<tr><td>${esc(k.metric)}</td><td>${k.approved ? '✓ ' : '✕ '}${esc(k.canonical_kpi || 'none')}</td><td>${esc(k.owner || '–')}</td><td class="num">${(k.conflicting_variants || []).length ? '▲ ' + k.conflicting_variants.length + ' variants' : '–'}</td></tr>`).join('')}</table>
    <h3>Rules applied</h3>${ruleChips(r.rules_cited)}`; },

  () => { const r = prop.recommendation, v = VERDICT[r.verdict] || VERDICT.NEW_BUILD;
    const counts = Object.fromEntries(Object.keys(VERDICT).map(k => [k, allProps.filter(p => p.recommendation.verdict === k && p.status !== 'superseded').length]));
    const max = Math.max(1, ...Object.values(counts));
    return `<h2>4. Recommendation</h2><div class="sub">Reuse, extend, consolidate, migrate, retire or build new, always with the reason.</div>
    ${(r.clarify || []).length ? `<div class="prov"><b>Provisional:</b> this is the engine's best guess so far. ${r.clarify.length} question${r.clarify.length === 1 ? ' is' : 's are'} still open, so it can't be approved yet. <a href="#" onclick="go(1);return false">Answer ${r.clarify.length === 1 ? 'it' : 'them'} →</a></div>` : ''}
    <div class="recgrid"><div class="rcard">
      <div class="band${(r.clarify || []).length ? ' provisional' : ''}" style="background:${v.band};color:${v.bfg}"><div><div class="lab">${(r.clarify || []).length ? 'Provisional recommendation' : 'Recommendation'}</div><div class="big">${esc(r.verdict.replace('_', ' '))}</div></div><div class="req">${esc(prop.proposal_id)}</div></div>
      <div class="rbody"><p class="headline">${esc(r.headline)}</p>
        ${policyLine(r.change_policy) ? `<div class="policy">🛡 <b>Non-destructive:</b> ${esc(policyLine(r.change_policy))}</div>` : ''}
        <div class="lab2">Evidence cited</div>${evRows(r.evidence)}
        ${(r.actions || []).length ? `<div class="lab2">What a person should do next</div><ol class="actions">${r.actions.map(a => `<li>${esc(a)}</li>`).join('')}</ol>` : ''}
        <div class="lab2">Rules applied</div>${ruleChips(r.rules_cited)}
        <div class="btns"><button class="act" onclick="go(4)">See the draft spec →</button></div></div></div>
      <aside class="rcard side"><div class="lab2">Outcomes across all requests</div>
        ${Object.entries(VERDICT).sort((a, b) => counts[b[0]] - counts[a[0]]).map(([k, x]) => `<div class="barrow"><span>${x.label}</span><div class="track"><i style="width:${counts[k] / max * 100}%;background:${x.bg};${x.outline ? 'border:2px solid #0068A8' : ''}"></i></div><b>${counts[k]}</b></div>`).join('')}
        <p class="small">Live counts of every request made on this machine.</p></aside></div>`; },

  () => { const s = prop.spec, p = s.preview || {};
    return `<h2>5. Preview</h2><div class="sub">The draft the approver signs off. Nothing is built until a person says yes.${prop.recommendation.verdict === 'RETIRE' ? (prop.status === 'approved' ? ' Retirement approved: no dashboard is built.' : ' After approval the asset is archived. No dashboard is built.')
      : prop.status === 'approved' ? ` <a href="/dashboard/${encodeURIComponent(prop.proposal_id)}" target="_blank" rel="noopener">Open the generated dashboard →</a>` : ' After approval, this becomes a live dashboard.'}</div>
    <div class="spec"><h3>${esc(s.title)}<span class="tag ${s.status === 'approved' ? 'ok' : ''}">${esc(s.status)}</span></h3>
    <div class="chips"><span class="chip">${esc(String(s.action).replace('_', ' '))}</span>${s.scope ? `<span class="chip">${esc(typeof s.scope === 'string' ? s.scope : JSON.stringify(s.scope))}</span>` : ''}</div>
    <div class="tiles">${(s.kpis || []).map(k => `<div>${esc(typeof k === 'string' ? k : k.metric || k.name || JSON.stringify(k))}<small>KPI tile</small></div>`).join('')}</div>
    <dl><dt>Layout</dt><dd>${esc(p.layout)}</dd><dt>Refresh</dt><dd>${esc(p.refresh)}</dd>
    ${s.reuse_asset ? `<dt>Builds on</dt><dd>${esc(typeof s.reuse_asset === 'string' ? s.reuse_asset : JSON.stringify(s.reuse_asset))}</dd>` : ''}
    ${s.build_on_model ? `<dt>Data model</dt><dd>${esc(typeof s.build_on_model === 'string' ? s.build_on_model : JSON.stringify(s.build_on_model))}</dd>` : ''}
    <dt>Accountable owner</dt><dd>${esc(s.accountable_owner || 'Not named yet')}</dd></dl>
    ${(s.required_actions || []).length ? `<h3>Required before go-live</h3><ul class="ev">${s.required_actions.map(a => `<li>${esc(a)}</li>`).join('')}</ul>` : ''}
    <h3>Governance rules</h3>${chips((s.governance_rules || []).map(g => typeof g === 'string' ? g : Object.entries(g).map(x => x.join(' ')).join(' ')), 'rule')}</div>`; },

  () => { const decided = prop.decision, st = prop.status, open = (prop.recommendation.clarify || []).length;
    const stCol = st === 'approved' ? 'var(--ok)' : st === 'pending_approval' ? 'var(--warn)' : 'var(--alert)';
    return `<h2>6. Approve</h2><div class="sub">Nothing goes live until an accountable person says yes. Every step is written to a tamper-evident audit log.</div>
    <span class="status" style="background:${stCol}">${esc(st.replace('_', ' ').toUpperCase())}</span>
    ${st === 'pending_approval' ? `
      ${open ? '<div class="blocked">This request has open questions, so approval will be refused. Answer them in step 2.</div>' : ''}
      <div class="row"><div><label id="lbl-apr">Who is deciding?</label>${dd('apr', approvers.map(a => ({ v: a.owner_id, t: a.owner_name + ' · ' + a.role })), pick.apr ?? approvers[0]?.owner_id ?? '', 'Choose a person')}</div>
      <div><label id="lbl-own">Accountable owner (required)</label>${dd('own', [{ v: '', t: '— choose a person —' }, ...approvers.map(a => ({ v: a.owner_id, t: a.owner_name + ' · ' + a.role }))], pick.own ?? approvers[1]?.owner_id ?? '', '— choose a person —')}</div></div>
      <p class="small" style="margin:.8em 0 0">Demo stand-in: in production the approver is the signed-in user (single sign-on), and the person named as accountable owner has to confirm they accept.</p>
      <label for="cmt">Comment${' (required to reject or send back)'}</label><input id="cmt">
      ${blockMsg ? `<div class="blocked">✕ Blocked: ${esc(blockMsg)}</div>` : ''}
      <div class="btns"><button class="act go" onclick="decide('approve')">✓ Approve</button><button class="act mid" onclick="decide('request_changes')">Request changes</button><button class="act no" onclick="decide('reject')">Reject</button></div>`
      : `<p class="headline">${esc(VERBS[decided?.decision] || st)} by <b>${esc(decided?.name || decided?.approver_id || '')}</b>${decided?.role ? ', ' + esc(decided.role) : ''}${decided?.comment ? ' · “' + esc(decided.comment) + '”' : ''}</p>
        ${decided?.accountable_owner ? `<div class="evrow">Accountable owner of this asset: <b>${esc(decided.accountable_owner)}</b></div>` : ''}
        <div class="evrow">Spec status: <b>${esc(prop.spec.status)}</b></div>
        ${prop.status === 'approved' ? '<div class="evrow">✓ Saved to My dashboards, so it is still there after a refresh. <a href="/my-dashboards">Open My dashboards →</a></div>' : ''}
        ${prop.recommendation.verdict === 'RETIRE' && prop.status === 'approved' ? retirePanel() : ''}
        <div class="btns">${prop.status === 'approved' && prop.recommendation.verdict !== 'RETIRE' ? `<a class="act open" href="/dashboard/${encodeURIComponent(prop.proposal_id)}" target="_blank" rel="noopener">Open the generated dashboard →</a>` : ''}${prop.status === 'approved' ? `<a class="act mid" href="/trace/${encodeURIComponent(prop.proposal_id)}" target="_blank" rel="noopener">Trace this decision →</a>` : ''}<button class="act mid" onclick="newRequest()">Start a new request</button><button class="act mid" onclick="go(4)">View the ${prop.spec.status === 'approved' ? 'approved ' : ''}spec</button></div>`}
    <h3>Audit log ${audit ? `<span class="badge" style="background:${audit.chain_valid ? 'var(--ok)' : 'var(--alert)'}">${audit.chain_valid ? '✓ Chain intact' : '✕ Tampered'}</span> <button class="dlb" onclick="downloadAudit('json')">Download JSON</button><button class="dlb" onclick="downloadAudit('csv')">Download CSV</button>` : ''}</h3>
    <div style="overflow-x:auto">${audit ? `<table class="audit"><tr><th>When</th><th>Who</th><th>Action</th><th>Request</th><th>Hash</th></tr>${audit.entries.map(e => `<tr><td>${esc(e.ts.replace('T', ' ').slice(0, 19))}</td><td>${esc(e.actor)}</td><td>${actionPill(e.event)}</td><td>${esc(e.proposal_id)}</td><td class="hash">${esc(String(e.hash).slice(0, 12))}…</td></tr>`).join('')}</table>` : 'Loading…'}</div>`; }
];
const preset = new URLSearchParams(location.search).get('prompt'); if (preset) request = preset; // e.g. opened from the home page with a prompt filled in
render(); loadReview();
// After a refresh, pick up where you were: restore the current proposal from the server instead of starting empty.
function restoreCurrent() {
  const id = store.get('dfCurrent'); if (!id || preset) return;
  api('/api/proposals/' + encodeURIComponent(id)).then(async p => {
    if (p.status === 'superseded') { store.del('dfCurrent'); return; }
    prop = p; pick = {}; audit = null; request = (p.recommendation.intent && p.recommendation.intent.raw) || p.spec.request || '';
    allProps = await api('/api/proposals').catch(() => [p]);
    go(p.status !== 'pending_approval' ? 5 : (p.recommendation.clarify || []).length ? 1 : 3);
  }).catch(() => store.del('dfCurrent'));
}
restoreCurrent();
</script>
