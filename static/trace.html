<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trace a dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,400;0,800;1,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/base.css">
<style>
  /* Tokens, header, focus, skeleton and error styles live in /static/base.css. */
  main { padding: 1.6em 2.4em 3em; max-width: 72em; margin: 0 auto; } main > * { min-width: 0; }
  h2 { margin: 2em 0 .6em; font-size: 1.4em; }
  .sec { border-top: .12em solid var(--navy); padding-top: 1em; }
  .row { display: flex; flex-wrap: wrap; gap: .6em; align-items: center; }
  .chip { background: var(--mist); color: var(--ink); border-radius: 99em; padding: .2em .8em; font-weight: 800; }
  .chip.ok { background: var(--ok-bg); color: var(--ok); } .chip.bad { background: var(--alert-bg); color: var(--alert); }

  .summary { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); background: var(--card); border: .06em solid var(--line); border-radius: 1.25em; overflow: hidden; }
  .summary > div { padding: 1em 1.3em; } .summary > div + div { border-left: .06em solid var(--line); }
  .summary .big { font-size: 1.3em; font-weight: 800; }
  .summary .verdict { font-size: 2.2em; font-weight: 800; font-style: italic; line-height: 1.1; }
  .quote { font-size: 1.3em; line-height: 1.4; border-left: .3em solid var(--brand-blue); padding-left: .8em; max-width: 50ch; }
  .evrow { background: var(--mist); border-radius: .75em; padding: .7em 1em; margin: .5em 0; line-height: 1.5; max-width: 65ch; }
  .headline { font-size: 1.25em; line-height: 1.4; max-width: 55ch; margin: 0 0 .6em; }
  .rule { border: .1em solid var(--brand-blue); color: var(--brand-blue); border-radius: .5em; padding: .2em .7em; }
  ol, ul.plain { margin: .3em 0 0; padding-left: 1.4em; line-height: 1.7; }
  .contacts { display: grid; grid-template-columns: repeat(auto-fit, minmax(15em, 1fr)); gap: .8em; }
  .contact { background: var(--card); border: .06em solid var(--line); border-radius: 1em; padding: .7em 1em; } .contact.off { border: .12em solid var(--alert); }
  .warnbox { background: var(--alert-bg); border: .12em solid var(--alert); border-radius: 1em; padding: 1em 1.4em; margin-top: 1.2em; max-width: 65em; } .warnbox ul { margin: 0; padding-left: 1.2em; line-height: 1.6; } .warnbox h3 { margin: 0 0 .3em; color: var(--alert); font-size: 1em; }
  table { width: 100%; border-collapse: collapse; min-width: 34em; } th, td { padding: .6em .8em .6em 0; border-top: .06em solid var(--line); text-align: left; } th { color: var(--muted); font-size: var(--s); font-weight: 400; }
  .btn { font: inherit; font-weight: 800; background: #fff; color: var(--brand-blue); border: .12em solid var(--brand-blue); border-radius: .7em; padding: .6em 1.1em; cursor: pointer; }
  .hash { font-family: ui-monospace, monospace; font-size: var(--s); color: var(--muted); } .scroll { overflow-x: auto; }
  dl { display: grid; grid-template-columns: 11em 1fr; gap: .4em 1em; margin: 0; } dt { color: var(--muted); } dd { margin: 0; }
  .skel { height: 8em; }
  @media (max-width: 800px) { header, main { padding-inline: 1em; } dl { grid-template-columns: 1fr; } .summary { grid-template-columns: 1fr 1fr; } .summary > div:nth-child(odd) { border-left: 0; } .summary > div:nth-child(n+3) { border-top: .06em solid var(--line); } }
</style>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header>
  <div><h1 id="title">Trace</h1><div class="meta" id="meta"></div></div>
  <nav aria-label="Pages"><a href="/my-dashboards">My dashboards</a><a href="/pipeline">Back to the factory</a><a id="dlink" class="light" href="#" hidden>Open dashboard</a></nav>
</header>
<main id="main"><div class="skel"></div></main>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const when = s => esc(String(s || '').replace('T', ' ').slice(0, 16)) + ' UTC';
const pid = location.pathname.split('/').pop();
const sentence = s => { const t = String(s ?? '').replace(/_/g, ' '); return t.charAt(0).toUpperCase() + t.slice(1); };
const stChip = s => s === 'active' ? '<span class="chip ok">active</span>' : s === 'inactive' ? '<span class="chip bad">no longer active</span>' : '<span class="chip bad">no owner recorded</span>';
// Same verdict colours as the pipeline: red is kept for risk, blocked and rejected.
const VERDICT = {
  REUSE:       { label: 'Reuse',       band: 'linear-gradient(120deg,#5DBB46 0%,#00B3B8 100%)', fg: '#0B2D3E' },
  EXTEND:      { label: 'Extend',      band: 'linear-gradient(120deg,#00B3B8 0%,#4DB8F5 100%)', fg: '#0B2D3E' },
  CONSOLIDATE: { label: 'Consolidate', band: 'linear-gradient(120deg,#4DB8F5 0%,#8AD0F7 100%)', fg: '#0B2D3E' },
  MIGRATE:     { label: 'Migrate',     band: 'linear-gradient(120deg,#0B2D3E 0%,#0068A8 100%)', fg: '#fff' },
  RETIRE:      { label: 'Retire',      band: 'linear-gradient(120deg,#4A5A66 0%,#2F3E48 100%)', fg: '#fff' },
  NEW_BUILD:   { label: 'Build new',   band: 'linear-gradient(120deg,#0068A8 0%,#005A94 100%)', fg: '#fff' }
};
const VERBS = { approve: 'Approved', reject: 'Rejected', request_changes: 'Changes requested' };

// spec.target_asset means different things per verdict.
const TARGET_LABEL = { RETIRE: 'Asset to archive', MIGRATE: 'Legacy asset being replaced', CONSOLIDATE: 'Asset to consolidate' };
let TRACE = null;
// Audit export for a SIEM or an auditor: the same chained entries, as JSON or CSV.
function saveFile(name, text, type) { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000); }
function downloadAudit(kind) {
  const au = TRACE && TRACE.audit; if (!au) return;
  if (kind === 'json') return saveFile(`audit-${pid}.json`, JSON.stringify(au, null, 2), 'application/json');
  const cell = v => '"' + String(v ?? '').replace(/"/g, '""') + '"', cols = ['seq', 'ts', 'event', 'actor', 'proposal_id', 'prev_hash', 'hash'];
  saveFile(`audit-${pid}.csv`, [cols.join(',') + ',detail', ...au.entries.map(e => cols.map(c => cell(e[c])).join(',') + ',' + cell(JSON.stringify(e.detail)))].join('\n'), 'text/csv');
}
function render(t) {
  TRACE = t;
  const r = t.recommendation || {}, dec = t.decision, acc = t.accountability || {}, au = t.audit || {}, u = t.understood_as || {};
  const name = t.spec_snapshot?.title || t.proposal_id, v = VERDICT[r.verdict] || { label: sentence(r.verdict), band: '#0B2D3E', fg: '#fff' };
  $('title').textContent = 'Trace: ' + name; document.title = 'Trace: ' + name;
  $('meta').textContent = `Request ${t.proposal_id}, status ${String(t.status).replace(/_/g, ' ')}`;
  if (t.dashboard_generated) { $('dlink').href = '/dashboard/' + encodeURIComponent(t.proposal_id); $('dlink').hidden = false; }
  const known = [...(u.products || []), ...(u.markets || []), ...(u.metrics || [])], newm = u.new_measures || [];
  const W = acc.warnings || [], entries = au.entries || [];
  const owner = (acc.contacts || []).find(c => dec && c.name && c.name === dec.accountable_owner);
  $('main').innerHTML = `
  <section class="summary" aria-label="Summary">
    <div style="background:${v.band};color:${v.fg}"><div>Recommended</div><div class="verdict">${esc(v.label)}</div></div>
    <div><div class="small">Decision</div>${dec ? `<div class="big">${esc(VERBS[dec.decision] || sentence(dec.decision))}</div><div class="small">by ${esc(dec.name)}, ${when(dec.at)}</div>` : '<div class="big">Not decided yet</div>'}</div>
    <div><div class="small">Accountable owner</div><div class="big">${esc(dec?.accountable_owner || 'Not named')}</div>${owner ? stChip(owner.status) : ''}</div>
    <div><div class="small">Audit log</div><div class="big" style="color:${au.chain_valid ? 'var(--ok)' : 'var(--alert)'}">${au.chain_valid ? '✓ Intact' : '✕ Altered'}</div><div class="small">${entries.length} entr${entries.length === 1 ? 'y' : 'ies'}${au.chain_valid ? ', none changed' : ', do not rely on this record'}</div></div>
  </section>
  ${W.length ? `<div class="warnbox" role="alert"><h3>⚠ Check before relying on this dashboard</h3><ul>${W.map(w => `<li>${esc(w)}</li>`).join('')}</ul></div>` : ''}

  <h2>Who asked, and for what</h2>
  <section class="sec"><div class="quote">“${esc(t.request?.text)}”</div>
    <p class="small">Asked by <b>${esc(t.request?.requester)}</b> on ${when(t.request?.at)}</p>
    <div class="row">${known.map(x => `<span class="chip">${esc(x)}</span>`).join('')}${newm.map(x => `<span class="chip bad">No governed KPI: ${esc(x)}</span>`).join('')}</div>
    ${(t.clarifying_questions || []).length ? `<p class="small">Questions the factory asked:</p><ul class="plain">${t.clarifying_questions.map(q => `<li>${esc(q)}</li>`).join('')}</ul>` : ''}</section>

  <h2>What the factory recommended, and the evidence shown</h2>
  <section class="sec"><p class="headline">${esc(r.headline)}</p>
    ${(r.evidence || []).map(e => `<div class="evrow">${esc(e)}</div>`).join('')}
    ${(r.actions || []).length ? `<p><b>Suggested next steps</b></p><ol>${r.actions.map(a => `<li>${esc(a)}</li>`).join('')}</ol>` : ''}
    <div class="row" style="margin-top:1em">${Object.entries(r.rules_cited || {}).map(([k, val]) => `<span class="rule">${esc(k)} ${esc(val)}</span>`).join('')}</div></section>

  <h2>The decision</h2>
  <section class="sec">${dec ? `<dl><dt>Decision</dt><dd><b>${esc(VERBS[dec.decision] || sentence(dec.decision))}</b></dd><dt>By</dt><dd>${esc(dec.name)}, ${esc(dec.role)}</dd><dt>When</dt><dd>${when(dec.at)}</dd>
      <dt>Comment</dt><dd>${esc(dec.comment || 'none')}</dd><dt>Accountable owner</dt><dd><b>${esc(dec.accountable_owner || 'n/a')}</b></dd></dl>` : '<p>No decision yet.</p>'}</section>

  <h2>Who owns it now</h2>
  <div class="sub">Read from the data pack just now.</div>
  <section class="sec"><div class="contacts">${(acc.contacts || []).map(c => `<div class="contact${c.status !== 'active' ? ' off' : ''}"><div class="small">${esc(c.role)}</div><b>${esc(c.name || 'Nobody recorded')}</b> ${stChip(c.status)}<div class="small">${esc(c.owner_role || '')}${c.email ? ', ' + esc(c.email) : ''}</div><div class="small">${esc(c.why || '')}</div></div>`).join('')}</div>
    ${acc.lifecycle ? `<p class="small">Review and upkeep: <b>${esc(acc.lifecycle.state)}</b>, review due ${esc(acc.lifecycle.review_due)} (${esc(acc.lifecycle.review_policy)})</p>` : ''}</section>

  <h2>What was built</h2>
  <section class="sec">${t.dashboard_generated ? `<p>A dashboard was generated on ${when(t.dashboard_generated.ts)}. <a href="/dashboard/${encodeURIComponent(t.proposal_id)}">Open it</a></p>` : '<p>No dashboard was built. A retirement or a pending decision builds nothing.</p>'}
    ${t.spec_snapshot ? `<dl class="small"><dt>Spec at approval</dt><dd>${esc(t.spec_snapshot.title)}</dd><dt>Action</dt><dd>${esc(String(t.spec_snapshot.action).replace('_', ' '))}</dd><dt>Status</dt><dd>${esc(t.spec_snapshot.status)}</dd>${t.spec_snapshot.target_asset ? `<dt>${TARGET_LABEL[r.verdict] || 'Asset in focus'}</dt><dd>${esc(t.spec_snapshot.target_asset)}</dd>` : ''}</dl>` : ''}</section>

  <div class="row" style="justify-content:space-between;margin:2em 0 .6em"><h2 style="margin:0">Audit log</h2>
    <span class="row"><span class="chip ${au.chain_valid ? 'ok' : 'bad'}">${au.chain_valid ? '✓ Audit log intact' : '✕ Audit log altered'}</span><button class="btn" onclick="downloadAudit('json')">Download JSON</button><button class="btn" onclick="downloadAudit('csv')">Download CSV</button></span></div>
  <section class="sec scroll"><table><tr><th>When</th><th>Who</th><th>What happened</th><th>Hash</th></tr>${entries.map(e => `<tr><td>${esc(String(e.ts).replace('T', ' ').slice(0, 19))}</td><td>${esc(e.actor)}</td><td><b>${esc(String(e.event).replace(/_/g, ' '))}</b></td><td class="hash">${esc(String(e.hash).slice(0, 12))}…</td></tr>`).join('')}</table></section>`;
}

function load() {
  $('main').innerHTML = '<div class="skel"></div>';
  fetch('/api/trace/' + encodeURIComponent(pid)).then(async r => {
    const b = await r.json().catch(() => ({}));
    if (!r.ok) { $('title').textContent = 'No trace found'; $('main').innerHTML = `<div class="error"><b>Nothing to trace for ${esc(pid)}.</b> ${esc(String(b.detail || 'The server returned error ' + r.status).replace(/\.?$/, '.'))} Check the request id, or pick a dashboard from My dashboards. <button class="btn" onclick="load()">Try again</button></div>`; return; }
    render(b);
  }).catch(e => { $('title').textContent = 'Trace not available'; $('main').innerHTML = `<div class="error"><b>The trace could not be loaded.</b> The server did not answer (${esc(e.message)}). Check that the app is running, then try again. <button class="btn" onclick="load()">Try again</button></div>`; });
}
load();
</script>
</body>
</html>
