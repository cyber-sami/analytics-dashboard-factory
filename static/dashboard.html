<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Generated dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,400;0,600;0,700;0,800;1,800&display=swap" rel="stylesheet">
<style>
  /* Same look as the Supply operations overview (static/index.html). Data comes from /api/dashboards/{id}. */
  :root {
    --navy: #0B2D3E; --brand-blue: #0068A8; --brand-green: #5DBB46; --bg: #F4F8FB; --cta: #C8003F; --card: #ffffff; --ink: #0B2D3E; --muted: #35566A; --line: #D5E2EB;
    --ok: #1a7f46; --ok-bg: #e3f6ea; --alert: #C8003F; --alert-bg: #fde4e7; --mist: #E8F3FA;
    --u: clamp(14px, 1vw, 22px); /* scales everything up on a wall screen */
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: "Figtree", system-ui, "Segoe UI", sans-serif; font-size: var(--u); font-weight: 400; font-variant-numeric: tabular-nums; }
  b, h1, h2, .num { font-weight: 800; }
  header { background: linear-gradient(120deg, #0B2D3E 0%, #0068A8 60%, #00B3B8 100%); color: #fff; padding: 1.2em 2.4em; display: flex; align-items: center; justify-content: space-between; gap: 1em; flex-wrap: wrap; }
  header h1 { margin: 0; font-size: 1.8em; letter-spacing: -.01em; font-style: italic; }
  header .meta { opacity: .85; font-size: 1.1em; max-width: 46em; }
  header .right { display: flex; gap: 1em; align-items: center; flex-wrap: wrap; }
  header a { color: #fff; text-decoration: none; font-weight: 800; background: #ffffff2e; border-radius: 99em; padding: .5em 1.2em; }
  .badge { font-size: 1.25em; font-weight: 800; padding: .35em 1em; border-radius: 99em; background: var(--ok); }
  main { padding: 1.6em 2.4em 2.4em; display: grid; gap: 2em; }
  h2 { margin: 0 0 .7em; font-size: 1em; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 1em; flex-wrap: wrap; }
  .row h2 { margin: 0; }

  .facts { display: flex; flex-wrap: wrap; gap: 1em; }
  .fact { background: var(--card); border: .06em solid var(--line); border-radius: 1.25em; padding: .7em 1.3em; }
  .fact small { display: block; font-size: .8em; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .fact b { font-size: 1.15em; }
  .hash { font-family: ui-monospace, monospace; font-size: .95em; }
  .sample { background: var(--mist); border-radius: 1em; padding: .9em 1.3em; color: var(--muted); line-height: 1.5; }

  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(20em, 1fr)); gap: 1.4em; }
  .card { background: var(--card); border-radius: 1.25em; padding: 1.2em 1.4em; border: .06em solid var(--line); }
  .cmpgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(26em, 1fr)); gap: 1.2em; }
  .cmpcard { background: var(--card); border: .06em solid var(--line); border-radius: 1.25em; padding: 1em 1.3em; min-width: 0; }
  .cmpchart { height: 15em; margin-top: .5em; }
  .seg { display: inline-flex; border: .1em solid var(--brand-blue); border-radius: .75em; overflow: hidden; }
  .seg button { font: inherit; font-weight: 800; background: #fff; color: var(--brand-blue); border: 0; padding: .4em 1.1em; cursor: pointer; }
  .seg button.on { background: var(--brand-blue); color: #fff; }
  .otiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(13em, 1fr)); gap: 1.2em; }
  .otile { background: var(--card); border: .06em solid var(--line); border-radius: 1.25em; padding: 1.1em 1.3em; min-width: 0; }
  .otile .label { font-size: 1.15em; font-weight: 800; color: var(--muted); } .otile .num { font-size: 3em; font-weight: 800; line-height: 1.1; color: var(--ink); }
  .otile .num small { font-size: .35em; font-weight: 600; color: var(--muted); } .otile .delta { color: var(--muted); margin: .1em 0 .3em; }
  .otile .mini { height: 3.2em; margin: .2em 0; } .otile .otag { font-size: .85em; color: var(--muted); }
  .pills { display: flex; flex-wrap: wrap; gap: .8em; }
  .pill { display: flex; align-items: center; gap: .6em; background: var(--card); border: .06em solid var(--line); border-radius: 99em; padding: .35em 1em .35em .4em; font-weight: 800; }
  .pill i { width: 1.5em; height: 1.5em; border-radius: 50%; display: grid; place-items: center; color: #fff; font-style: normal; font-size: .8em; } .pill small { color: var(--muted); font-weight: 400; }
  .pill .dot0 { background: var(--ok); } .pill .dot1 { background: #0068A8; } .pill .dot2 { background: var(--alert); }
  .card.redroute { border-left: .45em solid var(--alert); }
  .card .value small { font-size: .32em; font-weight: 600; color: var(--muted); }
  .subtitle { color: var(--muted); font-weight: 600; margin-top: .1em; }
  .card.pending { border-style: dashed; background: #fbfdfe; }
  .card .top { display: flex; justify-content: space-between; align-items: baseline; gap: .6em; }
  .card .kpi { font-size: 1.25em; font-weight: 800; line-height: 1.25; }
  .chip { font-size: .85em; font-weight: 600; color: var(--muted); background: var(--mist); border-radius: 99em; padding: .15em .8em; white-space: nowrap; }
  .card .value { font-size: 3.2em; font-weight: 800; line-height: 1.1; margin-top: .15em; color: var(--brand-blue); }
  .card .delta { font-size: 1em; color: var(--muted); margin: .1em 0 .4em; font-weight: 600; }
  .card .chart { height: 7em; }
  .card .cap { color: var(--muted); margin-top: .5em; font-size: .95em; }
  .card .warn { color: var(--alert); font-weight: 800; margin-top: .4em; }
  .chip.ng { background: #fff; border: .06em dashed var(--muted); font-weight: 800; }
  .small { color: var(--muted); font-size: .95em; margin-top: -1em; }
  .card.pending .value { color: var(--muted); font-size: 2em; }

  .strip { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: .6em 1em; background: var(--card); border: .06em solid var(--line); border-radius: 1em; padding: .6em 1em; color: var(--muted); }
  .chipbtn { font: inherit; font-weight: 800; background: var(--alert-bg); color: var(--alert); border: .08em solid var(--alert); border-radius: 99em; padding: .25em .9em; cursor: pointer; }
  .infopanel { display: grid; gap: 1.6em; } .infopanel > * { min-width: 0; } .infopanel[hidden] { display: none; }
  .todobtn { background: var(--brand-blue); color: #fff; border-color: var(--brand-blue); }
  .todopanel { background: #fff; border: .12em solid var(--brand-blue); border-radius: 1em; padding: 1em 1.4em; } .todopanel h2 { margin: 0 0 .4em; color: var(--brand-blue); }
  .stepgrp { margin: .5em 0; } .stepwho { font-weight: 800; color: var(--muted); font-size: .9em; letter-spacing: .04em; text-transform: uppercase; } .stepgrp ul { margin: .2em 0 0; padding-left: 1.3em; line-height: 1.7; }
  ol.todo { margin: 0; padding-left: 1.3em; line-height: 1.7; }
  .warnbtn { font: inherit; font-weight: 800; color: var(--alert); background: none; border: 0; padding: .2em 0; margin-top: .4em; cursor: pointer; text-align: left; text-decoration: underline dotted; text-underline-offset: .2em; }
  .warnbtn:hover { text-decoration-style: solid; }
  .vdetail { background: var(--alert-bg); border-radius: .8em; padding: .7em 1em; margin-top: .4em; line-height: 1.5; } .vdetail ul { margin: 0; padding-left: 1.2em; }
  .warnbox { background: var(--alert-bg); border: .12em solid var(--alert); border-radius: 1em; padding: 1em 1.4em; }
  .warnbox h3 { margin: 0 0 .3em; color: var(--alert); font-size: 1.05em; } .warnbox ul { margin: 0; padding-left: 1.2em; line-height: 1.6; }
  .contacts { display: grid; grid-template-columns: repeat(auto-fit, minmax(16em, 1fr)); gap: .8em; }
  .contact { background: #fff; border: .06em solid var(--line); border-radius: 1em; padding: .8em 1.1em; } .contact.off { border: .12em solid var(--alert); }
  .contact .role { font-size: .8em; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .chip.st.ok { background: var(--ok-bg); color: var(--ok); font-weight: 800; } .chip.st.bad { background: var(--alert-bg); color: var(--alert); font-weight: 800; }
  .who { background: var(--mist); border-radius: 1em; padding: 1em 1.4em; margin-top: 1em; }
  .who h3 { margin: 0 0 .4em; font-size: 1.05em; } .who ol { margin: 0; padding-left: 1.3em; line-height: 1.7; }
  main > * { min-width: 0; } /* grid children may shrink, so wide tables scroll inside their box instead of widening the page */
  table.trail th, table.trail td { text-align: left; } table.trail { min-width: 34em; }
  .rules { display: flex; flex-wrap: wrap; gap: .6em; }
  .rules span { background: var(--card); border: .06em solid var(--line); border-radius: 99em; padding: .3em 1em; font-weight: 600; }
  ul.todo { margin: 0; padding-left: 1.3em; line-height: 1.7; }
  button.tog { font: inherit; font-weight: 800; background: #fff; color: var(--brand-blue); border: .1em solid var(--brand-blue); border-radius: .75em; padding: .4em 1.2em; cursor: pointer; }
  table { width: 100%; border-collapse: collapse; background: var(--card); border-radius: 1em; overflow: hidden; }
  th, td { padding: .6em .9em; border-bottom: .06em solid var(--line); text-align: right; } th:first-child, td:first-child { text-align: left; }
  th { color: var(--muted); font-size: .85em; text-transform: uppercase; letter-spacing: .06em; }
  .scroll { overflow-x: auto; }

  .skel { background: linear-gradient(90deg, #E8F3FA 25%, #F4F8FB 50%, #E8F3FA 75%); background-size: 200% 100%; animation: sh 1.2s infinite; border-radius: 1em; }
  .skel.card { height: 16em; border: 0; } .skel.fact { height: 4em; width: 13em; }
  @keyframes sh { to { background-position: -200% 0; } }
  .error { background: var(--alert-bg); border: .15em solid var(--alert); border-radius: .9em; padding: 1.4em 1.6em; font-size: 1.15em; }
  .error button { font: inherit; font-weight: 800; margin-left: 1em; padding: .4em 1.2em; border-radius: .5em; border: 0; background: var(--alert); color: #fff; cursor: pointer; }
  @media (max-width: 800px) { header, main { padding-inline: 1em; } }
</style>
</head>
<body>
<header>
  <div><h1 id="title">Generating…</h1><div class="meta" id="meta"></div><div class="meta" id="policy" style="margin-top:.3em"></div></div>
  <div class="right">
    <a href="/my-dashboards">My dashboards</a>
    <a href="/pipeline">← Back to the factory</a>
    <div class="badge" id="badge" hidden>✓ Approved</div>
  </div>
</header>
<main id="main"></main>
<script>
Chart.defaults.font.family = '"Figtree", system-ui, sans-serif'; Chart.defaults.color = '#35566A';
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pid = location.pathname.split('/').pop();
function fmt(v, u) { const a = Math.abs(v);
  if (u === 'EUR') return '€' + (a >= 1e6 ? (v / 1e6).toFixed(1) + 'M' : a >= 1e3 ? (v / 1e3).toFixed(0) + 'k' : v.toFixed(0));
  if (u === '%') return v.toFixed(1) + '%'; if (u === 'weeks') return v.toFixed(1) + ' wks';
  if (u === 'units') return a >= 1e6 ? (v / 1e6).toFixed(2) + 'M' : (v / 1e3).toFixed(0) + 'k'; if (u === 'count') return Math.round(v).toLocaleString('en-GB'); if (u === 'ms') return Math.round(v).toLocaleString('en-GB') + ' ms'; return v.toFixed(1); }
let D, PROP = null, AUDIT = null, INFO_OPEN = false, TODO_OPEN = false, VIEW = 'overview', CMP_INDEXED = false, charts = [];

function skeleton() {
  $('main').innerHTML = `<div class="skel" style="height:3.2em"></div>
    <section><h2>KPIs</h2><div class="cards">${'<div class="skel card"></div>'.repeat(3)}</div></section>`;
}

// One plain line from the engine's change_policy: what happens to existing assets (non-destructive by default).
function policyLine(cp) {
  if (!cp) return '';
  const names = [...new Set((cp.consult || []).map(c => c.owner).filter(Boolean))], own = names.join(', ');
  if (cp.mode === 'derive') return `New dashboard derived from ${cp.derived_from}. ${cp.derived_from} stays unchanged for its users.${own ? ' Owner told: ' + own + '.' : ''}`;
  if (cp.mode === 'propose') return `Proposal only: ${own || 'the owners'} ${names.length > 1 ? 'are' : 'is'} asked. Nothing is changed without their agreement.`;
  if (cp.mode === 'retire_with_consent' || cp.mode === 'new_asset') return `${own ? 'Owner ' + own + ' is asked' : 'The owner is asked'}; the old asset keeps running until its users have moved.`;
  if (cp.mode === 'reuse_as_is') return `Reused as is: nothing is changed${(cp.unchanged || [])[0] ? ' (' + cp.unchanged[0] + ')' : ''}.`;
  return '';
}
// A percent change is meaningless when the value crosses zero (e.g. a variance), so those tiles show the absolute change.
function changeText(t, dl, pc) {
  if (t.change_basis !== 'absolute') return Math.abs(pc).toFixed(1) + '%';
  const sg = dl >= 0 ? '+' : '−', a = Math.abs(dl);
  return sg + (t.unit === '%' ? a.toFixed(1) + ' pts' : fmt(a, t.unit));
}
// What the red "conflicting KPI variants" line means, from the recommendation the engine stored (no extra API call).
const VARIANT_WHY = { definition_conflict: 'Defined differently, so its numbers can disagree with the approved KPI', duplicate_candidate: 'Probably the same measure under another name' };
function variantsHtml(t) {
  const base = t.slice ? String(t.metric).replace(' · ' + t.slice, '') : t.metric;
  const k = ((PROP && PROP.recommendation && PROP.recommendation.kpis) || []).find(x => x.metric === base);
  const list = k ? k.conflicting_variants || [] : [];
  return `<p style="margin:.2em 0 .5em"><b>This dashboard uses the approved definition${k ? ' ' + esc(k.canonical_kpi) : ''}.</b> The data pack also holds other definitions of ${esc(base)}, which could give different numbers elsewhere:</p>
    <ul>${list.length ? list.map(v => `<li><b>${esc(v.kpi_id)} ${esc(v.kpi_name)}</b> · ${esc(String(v.definition_status).replace(/_/g, ' '))}<br><span class="small">${esc(VARIANT_WHY[v.definition_status] || '')}</span></li>`).join('') : '<li class="small">Details are not available for this tile.</li>'}</ul>
    <p class="small" style="margin:.4em 0 0">What to do: ${t.kpi_owner ? '<b>' + esc(t.kpi_owner) + '</b>, the owner of the approved KPI, decides which definitions are kept, merged or retired (RULE-002). Nothing is changed by this dashboard.' : 'the KPI owner decides which definitions are kept, merged or retired (RULE-002).'}</p>`;
}
function toggleVariants(btn) { const d = btn.nextElementSibling; d.hidden = !d.hidden; btn.setAttribute('aria-expanded', String(!d.hidden)); }
function card(t, i) {
  if (t.state === 'pending') return `<div class="card pending"><div class="top"><span class="kpi">${esc(t.metric)}</span><span class="chip">${t.reason === 'not_in_pack' ? 'not in the pack' : 'no data yet'}</span></div>
    <div class="value">${esc(t.headline || 'No data')}</div>
    <div class="cap">${esc(t.message || '')}</div>${t.kpi_id ? `<div class="cap">${esc(t.kpi_id)}${t.kpi_owner ? ' · owner ' + esc(t.kpi_owner) : ''}</div>` : ''}</div>`;
  const snap = t.kind === 'snapshot', route = !!t.slice && !!t.risk_status;
  const dl = t.value - t.previous, pc = dl / Math.abs(t.previous || 1) * 100, n = (t.series || []).length;
  const base = route ? String(t.metric).replace(' · ' + t.slice, '') : null;
  const title = route ? t.slice : t.metric;
  const sub = route ? `<div class="subtitle">${esc(base)}, last ${n} months</div>` : '';
  const bigValue = snap ? `${Math.round(t.value)}<small> ${esc(t.value_label || '')}</small>` : fmt(t.value, t.unit);
  const delta = t.change_basis === 'none' ? '' : `<div class="delta">${dl >= 0 ? '▲' : '▼'} ${changeText(t, dl, pc)} vs last month</div>`;
  const cap = snap ? [t.frequency, t.breakdown_unit && 'bars: ' + t.breakdown_unit + ' by ' + t.breakdown_by].filter(Boolean).join(' · ')
    : [`Last ${n} months`, t.kpi_id, t.frequency, t.criticality && t.criticality + ' criticality', t.kpi_owner && 'owner ' + t.kpi_owner].filter(Boolean).join(' · ');
  return `<div class="card${t.risk_status === 'red' ? ' redroute' : ''}"><div class="top"><span class="kpi">${esc(title)}</span><span class="chip">${esc(t.origin)}</span></div>${sub}
    <div class="value">${bigValue}</div>
    ${delta}
    <div class="chart"><canvas data-i="${i}" role="img" aria-label="${esc(t.metric)}${snap ? ' by ' + esc(t.breakdown_by) : ', last ' + n + ' months'}"></canvas></div>
    <div class="cap">${esc(cap)}</div>
    <div class="cap">${t.governed === false ? '<span class="chip ng">not governed</span> ' : ''}${esc(t.data_note || '')}</div>
    ${t.conflicting_variants ? `<button type="button" class="warnbtn" aria-expanded="false" onclick="toggleVariants(this)">▲ ${t.conflicting_variants} conflicting KPI variants to resolve <span aria-hidden="true">▾</span></button><div class="vdetail" hidden>${variantsHtml(t)}</div>` : ''}</div>`;
}

// Overview: the calm layout of the home page (compact tiles, product chips, the most urgent routes). Charts and Table views stay one click away.
function conflictHtml(t) { return t.conflicting_variants ? `<button type="button" class="warnbtn" aria-expanded="false" onclick="toggleVariants(this)">▲ ${t.conflicting_variants} conflicting KPI variants ▾</button><div class="vdetail" hidden>${variantsHtml(t)}</div>` : ''; }
function otile(t, i) {
  const snap = t.kind === 'snapshot', dl = t.value - t.previous, pc = dl / Math.abs(t.previous || 1) * 100;
  const big = snap ? `${Math.round(t.value)}<small> ${esc(t.value_label || '')}</small>` : fmt(t.value, t.unit);
  const delta = t.change_basis === 'none' ? '' : `<div class="delta">${dl >= 0 ? '▲' : '▼'} ${changeText(t, dl, pc)} vs last month</div>`;
  return `<div class="otile"><div class="label">${esc(t.metric)}</div><div class="num">${big}</div>${delta}
    ${snap || !(t.series || []).length ? '' : `<div class="mini"><canvas data-i="${i}" data-mini="1" role="img" aria-label="${esc(t.metric)} trend"></canvas></div>`}
    <div class="otag">${t.governed === false ? '<span class="chip ng">not governed</span> ' : ''}${esc(t.origin || '')}</div>${conflictHtml(t)}</div>`;
}
function routeCard(t, i) {
  const base = String(t.metric).replace(' · ' + t.slice, ''), vs = t.series.map(x => x.value);
  const gap = t.target != null ? t.value - t.target : null;
  const take = gap == null ? '' : `${fmt(Math.abs(gap), t.unit === '%' ? 'pts' : t.unit)}${t.unit === '%' ? ' pts' : ' ' + t.unit} ${gap < 0 ? 'below' : 'above'} the ${esc(t.target_label || 'average')}`;
  return `<div class="card redroute"><div class="top"><span class="kpi">${esc(t.slice)}</span></div><div class="subtitle">${esc(base)}, last ${vs.length} months</div>
    <div class="value">${fmt(t.value, t.unit)}</div><div class="cap">${take}</div>
    <div class="chart"><canvas data-i="${i}" role="img" aria-label="${esc(t.metric)}, last ${vs.length} months"></canvas></div></div>`;
}
function overviewHtml(d) {
  const T = d.tiles.map((t, i) => [t, i]);
  const plain = T.filter(([t]) => t.state === 'ready' && !t.risk_status), route = T.filter(([t]) => t.state === 'ready' && t.risk_status), pend = T.filter(([t]) => t.state === 'pending');
  const snap = plain.find(([t]) => t.kind === 'snapshot');
  let h = plain.length ? `<section><div class="otiles">${plain.map(([t, i]) => otile(t, i)).join('')}</div></section>` : '';
  h += cmpHtml(d);
  if (snap && snap[0].breakdown) {
    const bd = snap[0].breakdown, tot = bd.reduce((a, x) => a + x.total, 0), share = tot ? bd.reduce((a, x) => a + x.red, 0) / tot * 100 : 0;
    h += `<section><h2>By ${esc(snap[0].breakdown_by || 'group')}</h2><div class="pills">${bd.map(x => { const lvl = x.share_pct > share ? 2 : x.red > 0 ? 1 : 0;
      return `<div class="pill" title="${esc(x.label + ': ' + x.red + ' of ' + x.total + ' routes red')}"><i class="dot${lvl}">${['✓', '▲', '✕'][lvl]}</i>${esc(x.label)} <small>${Math.round(x.share_pct)}% red</small></div>`; }).join('')}</div>
      <div class="small" style="margin-top:.5em">✕ above the share across the whole scope (${Math.round(share)}%), ▲ some red routes, ✓ none. Red is the data pack's own risk label.</div></section>`;
  }
  if (route.length) h += `<section><h2>Most urgent: ${route.length} route${route.length === 1 ? '' : 's'} marked red</h2><div class="cards">${route.map(([t, i]) => routeCard(t, i)).join('')}</div></section>`;
  if (pend.length) h += `<section><h2>Not available yet</h2><div class="cards">${pend.map(([t, i]) => card(t, i)).join('')}</div></section>`;
  return h;
}
function setView(v) { VIEW = v; render(); }
// Comparison: tiles that share a measure but differ by product, market or platform are drawn together in ONE chart, one colour each.
const CMP_COLORS = ['#0068A8', '#C8003F', '#00A3A8', '#6B4FC4', '#5DBB46', '#0B2D3E', '#4DB8F5'];
function cmpGroups(d) {
  const g = new Map();
  d.tiles.forEach((t, i) => { if (t.state !== 'ready' || !t.slice || t.risk_status || t.kind === 'snapshot' || !(t.series || []).length) return;
    const name = String(t.metric).replace(' · ' + t.slice, ''); if (!g.has(name)) g.set(name, { name, unit: t.unit, items: [] }); g.get(name).items.push({ t, i }); });
  return [...g.values()].filter(x => x.items.length >= 2);
}
function cmpHtml(d) {
  const gs = cmpGroups(d); if (!gs.length) return '';
  return `<section><div class="row" style="margin-bottom:.7em"><h2>Comparison</h2><div class="seg" role="group" aria-label="Scale">${[[false, 'Values'], [true, 'Indexed']].map(([k, l]) => `<button class="${CMP_INDEXED === k ? 'on' : ''}" aria-pressed="${CMP_INDEXED === k}" onclick="setCmpMode(${k})">${l}</button>`).join('')}</div></div>
    <div class="cmpgrid">${gs.map((x, k) => `<div class="cmpcard"><div class="kpi">${esc(x.name)}: ${x.items.map(y => esc(y.t.slice)).join(' vs ')}</div><div class="cmpchart"><canvas data-cmp="${k}" role="img" aria-label="${esc(x.name)} compared across ${x.items.map(y => esc(y.t.slice)).join(', ')}"></canvas></div></div>`).join('')}</div>
    <div class="small" style="margin-top:.5em">${CMP_INDEXED ? 'Indexed: each line starts at 100 in its first month, so the movement can be compared even when the levels differ.' : 'Values: the real numbers on one scale.'}</div></section>`;
}
function setCmpMode(v) { CMP_INDEXED = v; render(); }
function initComparisons(d) {
  const gs = cmpGroups(d);
  document.querySelectorAll('canvas[data-cmp]').forEach(cv => {
    const x = gs[cv.dataset.cmp]; if (!x) return;
    const months = [...new Set(x.items.flatMap(y => y.t.series.map(m => m.month)))].sort((a, b) => monthKey(a) - monthKey(b));
    const datasets = x.items.map((y, k) => {
      const mp = new Map(y.t.series.map(m => [m.month, m.value])), first = y.t.series[0].value;
      return { label: y.t.slice, data: months.map(m => mp.has(m) ? (CMP_INDEXED ? mp.get(m) / first * 100 : mp.get(m)) : null), borderColor: CMP_COLORS[k % CMP_COLORS.length], backgroundColor: CMP_COLORS[k % CMP_COLORS.length],
        borderWidth: 2.5, tension: .25, spanGaps: true, pointRadius: months.map((_, j) => j === months.length - 1 ? 4 : 0), pointHoverRadius: 5 };
    });
    charts.push(new Chart(cv, { type: 'line', data: { labels: months, datasets },
      options: { maintainAspectRatio: false, interaction: { mode: 'index', intersect: false },
        plugins: { legend: { position: 'bottom', labels: { usePointStyle: true, boxWidth: 8 } }, tooltip: { callbacks: { label: c => `${c.dataset.label}: ${CMP_INDEXED ? c.parsed.y.toFixed(0) + ' (index)' : fmt(c.parsed.y, x.unit)}` } } },
        scales: { y: { grid: { color: '#E8F3FA' }, ticks: { maxTicksLimit: 5, callback: v => CMP_INDEXED ? v : fmt(v, x.unit) } }, x: { grid: { display: false }, ticks: { maxTicksLimit: 5 } } } } }));
  });
}

// Months are matched by label (tiles have 7 to 10 points), snapshot tiles have categories instead of months and are skipped.
function monthKey(m) { return Date.parse('1 ' + String(m).slice(0, 3) + ' 20' + String(m).slice(-2)); }
function tableView(d) {
  const ready = d.tiles.filter(t => t.state === 'ready' && t.kind !== 'snapshot' && (t.series || []).length); if (!ready.length) return '';
  const months = [...new Set(ready.flatMap(t => t.series.map(x => x.month)))].sort((x, y) => monthKey(x) - monthKey(y));
  const look = ready.map(t => new Map(t.series.map(x => [x.month, x.value])));
  return `<div class="scroll"><table><tr><th>Month</th>${ready.map(t => `<th>${esc(t.metric)}</th>`).join('')}</tr>` +
    months.map(m => `<tr><td>${esc(m)}</td>${ready.map((t, j) => `<td>${look[j].has(m) ? fmt(look[j].get(m), t.unit) : '-'}</td>`).join('')}</tr>`).join('') + '</table></div>';
}

function render() {
  charts.forEach(c => c.destroy()); charts = [];
  const d = D, a = d.approval, src = d.source, ready = d.tiles.filter(t => t.state === 'ready'), hasData = ready.length > 0;
  $('title').textContent = d.title; document.title = d.title;
  $('meta').textContent = `Generated from approved spec ${d.proposal_id} · “${d.request}”`;
  $('policy').textContent = policyLine(d.change_policy);
  $('badge').hidden = false;
  const derived = d.change_policy && d.change_policy.mode === 'derive' ? d.change_policy.derived_from : null;
  const built = derived ? 'Derived from ' + derived + ' (unchanged)' : src.asset ? src.asset.asset_id + ' ' + src.asset.name : src.model ? src.model.model_id + ' ' + src.model.name : 'New, on a shared governed model';
  const kpiOwners = [...new Set(d.tiles.map(t => t.kpi_owner).filter(Boolean))], assetOwner = src.asset && src.asset.owner;
  const trail = AUDIT && AUDIT.entries ? `<section><div class="row" style="margin-bottom:.7em"><h2>Decision trail</h2><span class="chip" style="background:${AUDIT.chain_valid ? 'var(--ok-bg)' : 'var(--alert-bg)'};color:${AUDIT.chain_valid ? 'var(--ok)' : 'var(--alert)'};font-weight:800">${AUDIT.chain_valid ? '✓ Chain intact' : '✕ Tampered'}</span></div>
      <div class="scroll"><table class="trail"><tr><th>When</th><th>Who</th><th>What happened</th><th>Hash</th></tr>${AUDIT.entries.map(e => `<tr><td>${esc(e.ts.replace('T', ' ').slice(0, 19))}</td><td>${esc(e.actor)}</td><td><b>${esc(String(e.event).replace(/_/g, ' '))}</b></td><td class="hash">${esc(String(e.hash).slice(0, 12))}…</td></tr>`).join('')}</table></div>
      <div class="small" style="margin-top:.6em">If this dashboard is ever questioned: who asked for it, what evidence was shown, who approved it and who owns it are all recorded here and cannot be edited without breaking the chain.</div></section>` : '';
  // Contacts, freshness, warnings and lifecycle come from the engine and are read from the pack at view time.
  const W = d.warnings || [], C = d.contacts || [], LC = d.lifecycle, FR = d.freshness;
  const warnBox = W.length ? `<div class="warnbox"><h3>Check before relying on this dashboard</h3><ul>${W.map(w => `<li>${esc(w)}</li>`).join('')}</ul></div>` : '';
  const stChip = s => s === 'active' ? '<span class="chip st ok">active</span>' : s === 'inactive' ? '<span class="chip st bad">no longer active</span>' : '<span class="chip st bad">no owner recorded</span>';
  const contactsHtml = C.length ? `<div class="who"><h3>If it breaks or looks wrong, ask</h3><div class="contacts">${C.map(c => `<div class="contact${c.status !== 'active' ? ' off' : ''}">
      <div class="role">${esc(c.role)}</div><b>${esc(c.name || 'Nobody recorded')}</b> ${stChip(c.status)}
      <div class="small" style="margin:.2em 0 0">${esc(c.owner_role || '')}${c.email ? ' · ' + esc(c.email) : ''}</div><div class="small" style="margin:.2em 0 0">${esc(c.why || '')}</div></div>`).join('')}</div>
      <div class="small" style="margin:.6em 0 0">Read from the data pack every time this page opens, so a person who has left is flagged. Emails are synthetic. No on-call or escalation system is claimed.</div></div>` : '';
  const sub = t => `<span class="small" style="display:block;margin:0">${t}</span>`;
  const lifecycleHtml = LC ? `<section><h2>Lifecycle</h2><div class="facts">
      <div class="fact"><small>State</small><b>${esc(LC.state)}</b></div>
      <div class="fact"><small>Review due</small><b>${esc(LC.review_due)}</b>${sub(esc(LC.review_policy))}</div>
      ${LC.usage ? `<div class="fact"><small>Use, last 3 months</small><b>${esc(LC.usage.avg_monthly_users_3m)} users a month</b>${sub(esc(LC.usage.source) + '; low-use cutoff ' + esc(LC.usage.estate_low_use_cutoff) + ' (judgement call)')}</div>` : ''}
      ${FR ? `<div class="fact"><small>Data refresh</small><b${FR.refresh_status === 'healthy' ? '' : ' style="color:var(--alert)"'}>${esc(FR.refresh_status)}</b>, ${esc(FR.refresh_frequency)}${sub(esc(FR.model_id) + ' ' + esc(FR.model_name))}</div>` : ''}</div>
      ${LC.retire_signal ? `<div class="warnbox" style="margin-top:1em"><h3>Retire signal</h3><div>${esc(typeof LC.retire_signal === 'string' ? LC.retire_signal : JSON.stringify(LC.retire_signal))}</div></div>` : ''}
      <div class="small" style="margin-top:.6em">Review period and low-use cutoff are our assumptions, not Bayer policy. <a href="/trace/${encodeURIComponent(d.proposal_id)}">Trace this dashboard →</a></div></section>` : '';
  const nW = W.length;
  const strip = `<div class="strip"><span>Approved by <b>${esc(a.name)}</b> · accountable owner <b>${esc(a.accountable_owner || 'none named')}</b></span>
    <span class="row">${nW ? `<button class="chipbtn" onclick="toggleInfo(true)">▲ ${nW} warning${nW === 1 ? '' : 's'}</button>` : ''}
    ${todoPanel(d) ? `<button class="tog todobtn" id="todobtn" aria-expanded="${TODO_OPEN}" aria-controls="todo" onclick="toggleTodo()">${todoLabel(d)}</button>` : ''}
    <button class="tog" id="infobtn" aria-expanded="${INFO_OPEN}" aria-controls="info" onclick="toggleInfo()">${INFO_OPEN ? 'Hide' : 'Show'} ownership, lifecycle and audit ${INFO_OPEN ? '▴' : '▾'}</button></span></div>`;
  // The dashboard itself comes first; accountability, lifecycle and audit are one click away.
  $('main').innerHTML = `${strip}
    ${todoPanel(d)}
    ${d.data_note ? `<div class="small">${esc(d.data_note)}</div>` : ''}
    <section><div class="row" style="margin-bottom:.7em"><h2>${VIEW === 'overview' ? 'Overview' : 'KPIs'}</h2>${hasData ? `<div class="seg" role="group" aria-label="View">${[['overview', 'Overview'], ['charts', 'Charts'], ['table', 'Table']].map(([k, l]) => `<button class="${VIEW === k ? 'on' : ''}" aria-pressed="${VIEW === k}" onclick="setView('${k}')">${l}</button>`).join('')}</div>` : ''}</div>
      ${VIEW === 'table' && hasData ? tableView(d) : VIEW === 'overview' && hasData ? overviewHtml(d) : `${cmpHtml(d)}<div class="cards">${d.tiles.map(card).join('')}</div>`}</section>
    <div id="info" class="infopanel"${INFO_OPEN ? '' : ' hidden'}>
    ${warnBox}<section><h2>Accountability</h2><div class="facts">
      ${PROP ? `<div class="fact"><small>Asked by</small><b>${esc(PROP.requester)}</b>, ${esc(String(PROP.created).slice(0, 10))}</div>` : ''}
      <div class="fact"><small>Approved by</small><b>${esc(a.name)}</b>, ${esc(a.role)}</div>
      <div class="fact"><small>When</small><b>${esc(a.at.replace('T', ' ').slice(0, 16))} UTC</b></div>
      <div class="fact"><small>Accountable owner</small><b>${esc(a.accountable_owner)}</b></div>
      <div class="fact"><small>Built on</small><b>${esc(built)}</b></div>
      <div class="fact"><small>Approval hash</small><b class="hash">${esc((a.audit_hash || '').slice(0, 12))}…</b></div></div>
      ${contactsHtml}</section>
    ${lifecycleHtml}
    <section><h2>Governance rules applied</h2><div class="rules">${Object.entries(d.rules || {}).map(([k, v]) => `<span>${esc(k)} ${esc(v)}</span>`).join('')}</div></section>
    ${trail}</div>`;
  if (VIEW === 'table' && hasData) return;
  initComparisons(d);
  document.querySelectorAll('canvas[data-i]').forEach(cv => {
    const t = d.tiles[cv.dataset.i], s = t.series;
    if (cv.dataset.mini) { // small trend line inside an overview tile
      const vv = s.map(x => x.value), a = Math.min(...vv), b = Math.max(...vv), pd = (b - a) * 0.15 || Math.abs(a) * 0.05 || 1;
      charts.push(new Chart(cv, { type: 'line', data: { labels: s.map(x => x.month), datasets: [{ data: vv, borderColor: '#0068A8', backgroundColor: '#0068A822', fill: 'start', tension: .3, borderWidth: 2, pointRadius: vv.map((_, k) => k === vv.length - 1 ? 3.5 : 0) }] },
        options: { maintainAspectRatio: false, plugins: { legend: { display: false }, tooltip: { callbacks: { label: c => fmt(c.parsed.y, t.unit) } } }, scales: { y: { display: false, min: a - pd, max: b + pd }, x: { display: false } } } }));
      return;
    }
    if (t.chart_type === 'bar' && t.breakdown) { // snapshot tile: share of routes that are red, per product or market
      const bd = t.breakdown;
      charts.push(new Chart(cv, { type: 'bar',
        data: { labels: bd.map(x => x.label), datasets: [{ data: bd.map(x => x.share_pct), backgroundColor: '#C8003Fb3', borderRadius: 4 }] },
        options: { maintainAspectRatio: false, plugins: { legend: { display: false }, tooltip: { callbacks: {
            title: c => bd[c[0].dataIndex].label,
            label: c => { const x = bd[c.dataIndex]; return `${x.label}: ${x.red} of ${x.total} routes red (${Math.round(x.share_pct)}%)`; } } } },
          scales: { y: { display: false, min: 0 }, x: { grid: { display: false }, ticks: { maxRotation: 45, minRotation: 0, font: { size: 11 } } } } } }));
      return;
    }
    // Scale the axis to the series (and the target line, if any) so the line agrees with the change arrow.
    const vs = s.map(x => x.value), all = t.target != null ? [...vs, t.target] : vs;
    const lo = Math.min(...all), hi = Math.max(...all), pad = (hi - lo) * 0.12 || Math.abs(lo) * 0.05 || 1;
    const datasets = [{ data: vs, borderColor: t.risk_status === 'red' ? '#C8003F' : '#0068A8', backgroundColor: (t.risk_status === 'red' ? '#C8003F' : '#0068A8') + '22', fill: 'start', tension: .3,
      pointRadius: s.map((_, k) => k === s.length - 1 ? 6 : 0), pointHoverRadius: 6 }];
    if (t.target != null) datasets.push({ data: vs.map(() => t.target), borderColor: '#35566A', borderDash: [5, 4], borderWidth: 1.5, pointRadius: 0, fill: false });
    const targetLabel = { id: 'targetLabel', afterDatasetsDraw(c) { if (t.target == null) return; const x = c.ctx; x.save(); x.font = '800 12px Figtree, system-ui, sans-serif'; x.fillStyle = '#35566A'; x.textAlign = 'left';
      x.fillText('dashed: ' + (t.target_label || 'target') + ' ' + fmt(t.target, t.unit), c.chartArea.left, 10); x.restore(); } };
    charts.push(new Chart(cv, { type: 'line', plugins: [targetLabel],
      data: { labels: s.map(x => x.month), datasets },
      options: { maintainAspectRatio: false, layout: { padding: { top: t.target != null ? 16 : 0 } }, interaction: { mode: 'index', intersect: false },
        plugins: { legend: { display: false }, tooltip: { filter: c => c.datasetIndex === 0, callbacks: { label: c => fmt(c.parsed.y, t.unit) } } },
        scales: { y: { display: false, min: lo - pad, max: hi + pad }, x: { grid: { display: false }, ticks: { maxTicksLimit: 4 } } } } }));
  });
}

// Next steps: only what people still have to do is counted; what the factory already did is one quiet line. Falls back to the old list for older proposals.
const WHO_LABEL = { requester: 'Whoever runs this request', asset_owner: 'Owner of the existing dashboard', kpi_owner: 'KPI owner', steward: 'Data steward', bi_team: 'BI team', approver: 'Approver' };
const WHO_ORDER = ['requester', 'asset_owner', 'kpi_owner', 'steward', 'bi_team', 'approver'];
function steps(d) { return Array.isArray(d.next_steps) ? { todo: d.next_steps.filter(x => x.status === 'todo'), done: d.next_steps.filter(x => x.status === 'done'), tagged: true }
  : { todo: (d.required_actions || []).map(t => ({ text: t, who: null, status: 'todo' })), done: [], tagged: false }; }
function todoLabel(d) { const n = steps(d).todo.length; return (TODO_OPEN ? 'Hide' : 'Show') + ' ' + (n ? 'next steps before go-live · ' + n : 'next steps: nothing left to do') + ' ' + (TODO_OPEN ? '▴' : '▾'); }
function todoPanel(d) {
  const st = steps(d); if (!st.todo.length && !st.done.length) return '';
  const groups = st.tagged ? WHO_ORDER.map(w => [w, st.todo.filter(x => x.who === w)]).filter(([, a]) => a.length).concat(st.todo.some(x => !WHO_ORDER.includes(x.who)) ? [['other', st.todo.filter(x => !WHO_ORDER.includes(x.who))]] : [])
    : [['other', st.todo]];
  const body = groups.map(([w, a]) => { const names = ['asset_owner', 'kpi_owner'].includes(w) ? [...new Set(a.map(x => x.who_name).filter(Boolean))] : [];
    return `<div class="stepgrp">${w === 'other' ? '' : `<div class="stepwho">${esc(WHO_LABEL[w])}${names.length ? ' · ' + names.map(esc).join(', ') : ''}</div>`}<ul>${a.map(x => `<li>${esc(x.text)}</li>`).join('')}</ul></div>`; }).join('');
  return `<div id="todo" class="todopanel"${TODO_OPEN ? '' : ' hidden'}><h2>Next steps before go-live</h2>
    ${body || '<p style="margin:0">Nothing left for anyone to do.</p>'}
    ${st.done.length ? `<p class="small" style="margin:.8em 0 0"><b>Done by the factory:</b> ${st.done.map(x => esc(x.text)).join(' · ')}</p>` : ''}
    <p class="small" style="margin:.5em 0 0">In this prototype the factory builds and records; telling people and certifying is a step for them.</p></div>`;
}
function toggleTodo() {
  TODO_OPEN = !TODO_OPEN; $('todo').hidden = !TODO_OPEN; const b = $('todobtn');
  b.setAttribute('aria-expanded', String(TODO_OPEN)); b.textContent = todoLabel(D);
}
function toggleInfo(forceOpen) {
  INFO_OPEN = forceOpen === true ? true : !INFO_OPEN;
  $('info').hidden = !INFO_OPEN; const b = $('infobtn');
  b.setAttribute('aria-expanded', INFO_OPEN); b.textContent = (INFO_OPEN ? 'Hide' : 'Show') + ' ownership, lifecycle and audit ' + (INFO_OPEN ? '▴' : '▾');
  if (INFO_OPEN) $('info').scrollIntoView({ behavior: 'smooth', block: 'start' });
}
function load() {
  skeleton();
  const side = u => fetch(u).then(r => r.ok ? r.json() : null).catch(() => null); // who asked + audit trail; page still works without them
  fetch('/api/dashboards/' + encodeURIComponent(pid)).then(async r => {
    const b = await r.json().catch(() => ({}));
    if (!r.ok) { $('title').textContent = 'No dashboard yet'; $('main').innerHTML = `<div class="error"><b>Not generated.</b> ${esc(b.detail || 'Server answered ' + r.status)}</div>`; return; }
    [PROP, AUDIT] = await Promise.all([side('/api/proposals/' + encodeURIComponent(pid)), side('/api/audit?proposal_id=' + encodeURIComponent(pid))]);
    D = b; render();
  }).catch(e => { $('title').textContent = 'Could not load'; $('main').innerHTML = `<div class="error"><b>Could not load this dashboard.</b> ${esc(e.message)} <button onclick="load()">Try again</button></div>`; });
}
load();
</script>
</body>
</html>
