<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,400;0,800;1,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/base.css">
<style>
  /* Same look as the Supply operations overview (static/index.html). Tokens, header, focus, skeleton and error styles live in /static/base.css.
     Data comes from /api/dashboards/{id}. */
  html { scroll-behavior: smooth; }
  header .meta + .meta { margin-top: .3em; }
  .num { font-weight: 800; }
  .badge { font-weight: 800; padding: .35em 1em; border-radius: 99em; background: var(--ok); }
  main { padding: 1.6em 2.4em 2.4em; display: grid; gap: 2em; }
  h2 { margin: 0 0 .7em; font-size: 1em; color: var(--muted); }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 1em; flex-wrap: wrap; }
  .row.head { margin-bottom: .7em; }
  .row h2 { margin: 0; }

  .facts { display: flex; flex-wrap: wrap; gap: 1em; }
  .fact { background: var(--card); border: .06em solid var(--line); border-radius: 1.25em; padding: .7em 1.3em; }
  .fact small { display: block; font-size: var(--s); color: var(--muted); }
  .hash { font-family: ui-monospace, monospace; font-size: var(--s); }
  .sample { background: var(--mist); border-radius: 1em; padding: .9em 1.3em; color: var(--muted); line-height: 1.5; }

  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(20em, 1fr)); gap: 1.4em; }
  .card { background: var(--card); border-radius: 1.25em; padding: 1.2em 1.4em; border: .06em solid var(--line); }
  .cmpgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(26em, 1fr)); gap: 1.2em; }
  .cmpcard { background: var(--card); border: .06em solid var(--line); border-radius: 1.25em; padding: 1em 1.3em; min-width: 0; }
  .cmpchart { height: 15em; margin-top: .5em; }
  .seg { display: inline-flex; border: .1em solid var(--brand-blue); border-radius: .75em; overflow: hidden; }
  .seg button { font: inherit; font-weight: 800; background: #fff; color: var(--brand-blue); border: 0; padding: .4em 1.1em; cursor: pointer; }
  .seg button.on { background: var(--brand-blue); color: #fff; }
  .seg button:focus-visible { outline-offset: -.3em; }
  .seg button.on:focus-visible { outline-color: #fff; }
  .otiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(13em, 1fr)); gap: 1.2em; }
  .otile { background: var(--card); border: .06em solid var(--line); border-radius: 1.25em; padding: 0 1.3em 1.1em; min-width: 0; overflow: hidden; }
  .otile .strip { display: block; height: .4em; margin: 0 -1.3em .8em; } /* one colour per tile; red only for the risk snapshot */
  .otile .label { font-weight: 800; color: var(--muted); } .otile .num { font-size: 3em; line-height: 1.1; color: var(--ink); }
  .otile .num small { font-size: .35em; font-weight: 400; color: var(--muted); } .otile .delta { margin: .1em 0 .3em; }
  .otile .mini { height: 3.2em; margin: .2em 0; } .otile .otag { font-size: var(--s); color: var(--muted); }
  .pills { display: flex; flex-wrap: wrap; gap: .8em; }
  .pill { display: flex; align-items: center; gap: .6em; background: var(--card); border: .06em solid var(--line); border-radius: 99em; padding: .35em 1em .35em .4em; font-weight: 800; }
  .pill i { width: 1.5em; height: 1.5em; border-radius: 50%; display: grid; place-items: center; color: #fff; font-style: normal; font-size: var(--s); } .pill small { color: var(--muted); font-weight: 400; }
  .pill .dot0 { background: var(--ok); } .pill .dot1 { background: #8A5300; } .pill .dot2 { background: var(--alert); }
  .card.redroute { border-left: .45em solid var(--alert); }
  .card .value small { font-size: .32em; font-weight: 400; color: var(--muted); }
  .subtitle { color: var(--muted); margin-top: .1em; }
  .card.pending { border-style: dashed; background: #fbfdfe; }
  .card .top { display: flex; justify-content: space-between; align-items: baseline; gap: .6em; }
  .card .kpi, .cmpcard .kpi { font-weight: 800; line-height: 1.25; }
  .chip { font-size: var(--s); color: var(--muted); background: var(--mist); border-radius: 99em; padding: .15em .8em; white-space: nowrap; }
  .card .value { font-size: 3em; font-weight: 800; line-height: 1.1; margin-top: .15em; color: var(--brand-blue); }
  .delta { font-weight: 800; color: var(--muted); }
  .delta.good { color: var(--ok); } .delta.bad { color: var(--alert); }
  .card .delta { margin: .1em 0 .4em; }
  .card .chart { height: 7em; }
  .card .cap { color: var(--muted); margin-top: .5em; font-size: var(--s); }
  .more { margin-top: .4em; color: var(--muted); font-size: var(--s); } .more summary { cursor: pointer; font-weight: 800; } .more div { margin-top: .2em; }
  .chip.ng { background: #fff; border: .06em dashed var(--muted); font-weight: 800; }
  .note { margin-top: .6em; } .tight { margin-top: .2em; }
  .small, .cap, .subtitle, .sample, .vdetail, .todopanel li, .warnbox li { max-width: 65ch; }
  .card.pending .value { color: var(--muted); font-size: var(--l); }

  .strip { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: .6em 1em; background: var(--card); border: .06em solid var(--line); border-radius: 1em; padding: .6em 1em; color: var(--muted); }
  .chipbtn { font: inherit; font-weight: 800; background: var(--alert-bg); color: var(--alert); border: .08em solid var(--alert); border-radius: 99em; padding: .25em .9em; cursor: pointer; }
  .infopanel { display: grid; gap: 1.6em; } .infopanel > * { min-width: 0; } .infopanel[hidden] { display: none; }
  button.tog.todobtn { background: var(--brand-blue); color: #fff; border-color: var(--brand-blue); }
  button.tog.todobtn:focus-visible { outline-color: var(--navy); }
  .todopanel { background: #fff; border: .12em solid var(--brand-blue); border-radius: 1em; padding: 1em 1.4em; } .todopanel h2 { margin: 0 0 .4em; color: var(--brand-blue); }
  .stepgrp { margin: .5em 0; } .stepwho { font-weight: 800; color: var(--muted); font-size: var(--s); } .stepgrp ul { margin: .2em 0 0; padding-left: 1.3em; line-height: 1.7; }
  ol.todo { margin: 0; padding-left: 1.3em; line-height: 1.7; }
  .warnbtn { font: inherit; font-weight: 800; color: var(--alert); background: none; border: 0; padding: .2em 0; margin-top: .4em; cursor: pointer; text-align: left; text-decoration: underline dotted; text-underline-offset: .2em; }
  .warnbtn:hover { text-decoration-style: solid; }
  .vdetail { background: var(--alert-bg); border-radius: .8em; padding: .7em 1em; margin-top: .4em; line-height: 1.5; } .vdetail ul { margin: 0; padding-left: 1.2em; }
  .warnbox { background: var(--alert-bg); border: .12em solid var(--alert); border-radius: 1em; padding: 1em 1.4em; }
  .warnbox.gap { margin-top: 1em; }
  .warnbox h3 { margin: 0 0 .3em; color: var(--alert); font-size: 1em; } .warnbox ul { margin: 0; padding-left: 1.2em; line-height: 1.6; }
  .contacts { display: grid; grid-template-columns: repeat(auto-fit, minmax(16em, 1fr)); gap: .8em; }
  .contact { background: #fff; border: .06em solid var(--line); border-radius: 1em; padding: .8em 1.1em; } .contact.off { border: .12em solid var(--alert); }
  .contact .role { font-size: var(--s); color: var(--muted); }
  .chip.st.ok { background: var(--ok-bg); color: var(--ok); font-weight: 800; } .chip.st.bad { background: var(--alert-bg); color: var(--alert); font-weight: 800; }
  .who { background: var(--mist); border-radius: 1em; padding: 1em 1.4em; margin-top: 1em; }
  .who h3 { margin: 0 0 .4em; font-size: 1em; } .who ol { margin: 0; padding-left: 1.3em; line-height: 1.7; }
  main > * { min-width: 0; } /* grid children may shrink, so wide tables scroll inside their box instead of widening the page */
  table.trail th, table.trail td { text-align: left; } table.trail { min-width: 34em; }
  .rules { display: flex; flex-wrap: wrap; gap: .6em; }
  .rules span { background: var(--card); border: .06em solid var(--line); border-radius: 99em; padding: .3em 1em; }
  ul.todo { margin: 0; padding-left: 1.3em; line-height: 1.7; }
  button.tog { font: inherit; font-weight: 800; background: #fff; color: var(--brand-blue); border: .1em solid var(--brand-blue); border-radius: .75em; padding: .4em 1.2em; cursor: pointer; }
  table { width: 100%; border-collapse: collapse; background: var(--card); border-radius: 1em; overflow: hidden; }
  th, td { padding: .6em .9em; border-bottom: .06em solid var(--line); text-align: right; } th:first-child, td:first-child { text-align: left; }
  th { color: var(--muted); font-size: var(--s); }
  .scroll { overflow-x: auto; }
  .scroll th:first-child, .scroll td:first-child { position: sticky; left: 0; background: var(--card); } /* month stays visible when a wide table scrolls */

  .skel.card { height: 16em; border: 0; } .skel.fact { height: 4em; width: 13em; }
  @media (max-width: 800px) { main { padding-inline: 1em; } }
</style>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header>
  <div><h1 id="title">Loading dashboard…</h1><div class="meta" id="meta"></div><div class="meta" id="policy"></div></div>
  <nav class="right" aria-label="Pages">
    <a href="/my-dashboards">My dashboards</a>
    <a href="/pipeline">Back to the factory</a>
    <div class="badge" id="badge" hidden>✓ Approved</div>
  </nav>
</header>
<div class="sr" id="live" aria-live="polite"></div>
<main id="main"></main>
<script>
const REDUCED = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
Chart.defaults.font.family = '"Figtree", system-ui, sans-serif'; Chart.defaults.color = '#35566A';
if (REDUCED) Chart.defaults.animation = false;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pid = location.pathname.split('/').pop();
function fmt(v, u) { const a = Math.abs(v);
  if (u === 'EUR') return '€' + (a >= 1e6 ? (v / 1e6).toFixed(1) + 'M' : a >= 1e3 ? (v / 1e3).toFixed(0) + 'k' : v.toFixed(0));
  if (u === '%') return v.toFixed(1) + '%'; if (u === 'weeks') return v.toFixed(1) + ' wks';
  if (u === 'units') return a >= 1e6 ? (v / 1e6).toFixed(2) + 'M' : (v / 1e3).toFixed(0) + 'k'; if (u === 'count') return Math.round(v).toLocaleString('en-GB'); if (u === 'ms') return Math.round(v).toLocaleString('en-GB') + ' ms'; return v.toFixed(1); }
let D, PROP = null, AUDIT = null, INFO_OPEN = false, TODO_OPEN = false, VIEW = 'overview', CMP_INDEXED = false, charts = [];

function skeleton() {
  $('main').innerHTML = `<div class="skel" style="height:3.2em"></div>
    <section><div class="cards">${'<div class="skel card"></div>'.repeat(3)}</div></section>`;
}

// One plain line from the engine's change_policy: what happens to existing assets (non-destructive by default).
function policyLine(cp) {
  if (!cp) return '';
  const names = [...new Set((cp.consult || []).map(c => c.owner).filter(Boolean))], own = names.join(', ');
  if (cp.mode === 'derive') return `New dashboard derived from ${cp.derived_from}. ${cp.derived_from} stays unchanged for its users.${own ? ' Owner told: ' + own + '.' : ''}`;
  if (cp.mode === 'propose') return `Proposal only: ${own || 'the owners'} ${names.length > 1 ? 'are' : 'is'} asked. Nothing is changed without their agreement.`;
  if (cp.mode === 'retire_with_consent' || cp.mode === 'new_asset') return `${own ? 'Owner ' + own + ' is asked' : 'The owner is asked'}; the old asset keeps running until its users have moved.`;
  if (cp.mode === 'reuse_as_is') return `Reused as is: nothing is changed${(cp.unchanged || [])[0] ? ' (' + cp.unchanged[0] + ')' : ''}.`;
  return '';
}
// A percent change is meaningless when the value crosses zero (e.g. a variance), so those tiles show the absolute change.
function changeText(t, dl, pc) {
  if (t.change_basis !== 'absolute') return Math.abs(pc).toFixed(1) + '%';
  const sg = dl >= 0 ? '+' : '−', a = Math.abs(dl);
  return sg + (t.unit === '%' ? a.toFixed(1) + ' pts' : fmt(a, t.unit));
}
// Is a rise good or bad? The engine says so on each tile (t.direction, from engine/measures.py). Missing or null means
// neutral grey, e.g. a variance where closest to zero is best, so a colour is never guessed.
const direction = t => t.direction || null;
// One sentence from what moved since last month, worse first. Per-product tiles and neutral measures stay out of it.
function takeaway(d) {
  const mv = d.tiles.filter(t => t.state === 'ready' && !t.slice && t.kind !== 'snapshot' && t.change_basis !== 'none' && t.direction && t.value !== t.previous)
    .map(t => ({ name: String(t.metric).toLowerCase(), good: (t.direction === 'higher_is_better') === (t.value > t.previous) }));
  const names = a => a.length > 1 ? a.slice(0, -1).join(', ') + ' and ' + a.at(-1) : a[0];
  const up = mv.filter(m => m.good).map(m => m.name), down = mv.filter(m => !m.good).map(m => m.name);
  const s = down.length && up.length ? `${names(down)} got worse, while ${names(up)} improved` : down.length ? `${names(down)} got worse` : up.length ? `${names(up)} improved` : '';
  return s.charAt(0).toUpperCase() + s.slice(1);
}
const variantLabel = t => { const b = t.slice ? String(t.metric).replace(' · ' + t.slice, '') : t.metric, n = t.conflicting_variants; return `⚠ ${n} other definition${n === 1 ? '' : 's'} of ${esc(b)}`; };
// Table columns use one format per column (same decimals, same k or M) and say their unit.
const UNIT_NAME = { EUR: 'euros', '%': 'percent', weeks: 'weeks', units: 'units', count: 'count', ms: 'milliseconds' };
function colFmt(t) { const m = Math.max(...t.series.map(x => Math.abs(x.value)));
  if (t.unit === 'EUR') return m >= 1e6 ? v => '€' + (v / 1e6).toFixed(2) + 'M' : m >= 1e3 ? v => '€' + (v / 1e3).toFixed(0) + 'k' : v => '€' + v.toFixed(0);
  if (t.unit === 'units') return m >= 1e6 ? v => (v / 1e6).toFixed(2) + 'M' : v => (v / 1e3).toFixed(0) + 'k';
  return v => fmt(v, t.unit); }
const endLabelFor = t => ({ id: 'endLabel', afterDatasetsDraw(c) { const p = c.getDatasetMeta(0).data, last = p[p.length - 1]; if (!last) return; const x = c.ctx; x.save(); x.font = '800 13px Figtree, system-ui, sans-serif'; x.fillStyle = c.data.datasets[0].borderColor; x.textAlign = 'right'; x.textBaseline = 'bottom'; x.fillText(fmt(t.value, t.unit), last.x + 4, last.y - 9); x.restore(); } });
const barLabels = { id: 'barLabels', afterDatasetsDraw(c) { const x = c.ctx; x.save(); x.font = '800 12px Figtree, system-ui, sans-serif'; x.fillStyle = '#35566A'; x.textAlign = 'center'; c.getDatasetMeta(0).data.forEach((b, i) => x.fillText(Math.round(c.data.datasets[0].data[i]) + '%', b.x, b.y - 4)); x.restore(); } };
// Change versus last month: arrow for direction, colour and the words better/worse for whether that is good, so colour is never the only cue.
function deltaHtml(t) {
  if (t.change_basis === 'none') return '';
  const dl = t.value - t.previous, pc = dl / Math.abs(t.previous || 1) * 100, up = dl >= 0, flat = Math.abs(dl) < 1e-9, dir = direction(t);
  let cls = '', word = '';
  if (dir && !flat) { const good = (dir === 'higher_is_better') === up; cls = good ? ' good' : ' bad'; word = good ? ', better' : ', worse'; }
  return `<div class="delta${cls}">${flat ? '–' : up ? '▲' : '▼'} ${changeText(t, dl, pc)} vs last month${word}</div>`;
}
// What the red "conflicting KPI variants" line means, from the recommendation the engine stored (no extra API call).
const VARIANT_WHY = { definition_conflict: 'Defined differently, so its numbers can disagree with the approved KPI', duplicate_candidate: 'Probably the same measure under another name' };
function variantsHtml(t) {
  const base = t.slice ? String(t.metric).replace(' · ' + t.slice, '') : t.metric;
  const k = ((PROP && PROP.recommendation && PROP.recommendation.kpis) || []).find(x => x.metric === base);
  const list = k ? k.conflicting_variants || [] : [];
  return `<p style="margin:.2em 0 .5em"><b>This dashboard uses the approved definition${k ? ' ' + esc(k.canonical_kpi) : ''}.</b> The data pack also holds other definitions of ${esc(base)}, which could give different numbers elsewhere:</p>
    <ul>${list.length ? list.map(v => `<li><b>${esc(v.kpi_id)} ${esc(v.kpi_name)}</b>, ${esc(String(v.definition_status).replace(/_/g, ' '))}<br><span class="small">${esc(VARIANT_WHY[v.definition_status] || '')}</span></li>`).join('') : '<li class="small">Details are not available for this measure.</li>'}</ul>
    <p class="small note">What to do: ${t.kpi_owner ? '<b>' + esc(t.kpi_owner) + '</b>, the owner of the approved KPI, decides which definitions are kept, merged or retired. Nothing is changed by this dashboard.' : 'the KPI owner decides which definitions are kept, merged or retired.'}</p>`;
}
function toggleVariants(btn) { const d = btn.nextElementSibling; d.hidden = !d.hidden; btn.setAttribute('aria-expanded', String(!d.hidden)); }
// Secondary facts about a tile (KPI id, frequency, criticality, owner) sit one click away, one per line.
function moreHtml(lines) { const l = lines.filter(Boolean); return l.length ? `<details class="more"><summary>Details</summary>${l.map(x => `<div>${esc(x)}</div>`).join('')}</details>` : ''; }
function card(t, i) {
  if (t.state === 'pending') return `<div class="card pending"><div class="top"><span class="kpi">${esc(t.metric)}</span><span class="chip">${t.reason === 'not_in_pack' ? 'not in the pack' : 'no data yet'}</span></div>
    <div class="value">${esc(t.headline || 'No data')}</div>
    <div class="cap">${esc(t.message || '')}</div>${t.kpi_id ? `<div class="cap">${esc(t.kpi_id)}${t.kpi_owner ? ', owner ' + esc(t.kpi_owner) : ''}</div>` : ''}</div>`;
  const snap = t.kind === 'snapshot', route = !!t.slice && !!t.risk_status;
  const n = (t.series || []).length;
  const base = route ? String(t.metric).replace(' · ' + t.slice, '') : null;
  const title = route ? t.slice : t.metric;
  const sub = route ? `<div class="subtitle">${esc(base)}, last ${n} months</div>` : '';
  const bigValue = snap ? `${Math.round(t.value)}<small> ${esc(t.value_label || '')}</small>` : fmt(t.value, t.unit);
  const cap = snap ? (t.breakdown_unit ? 'Bars show ' + t.breakdown_unit + ' by ' + t.breakdown_by : '') : `Last ${n} months`;
  const more = snap ? [t.frequency] : [t.kpi_id, t.frequency, t.criticality && t.criticality + ' criticality', t.kpi_owner && 'Owner: ' + t.kpi_owner];
  return `<div class="card${t.risk_status === 'red' ? ' redroute' : ''}"><div class="top"><span class="kpi">${esc(title)}</span><span class="chip">${esc(t.origin)}</span></div>${sub}
    <div class="value">${bigValue}</div>
    ${deltaHtml(t)}
    <div class="chart"><canvas data-i="${i}" role="img" aria-label="${esc(t.metric)}${snap ? ' by ' + esc(t.breakdown_by) : ', last ' + n + ' months'}"></canvas></div>
    <div class="cap">${esc(cap)}</div>
    <div class="cap">${t.governed === false ? '<span class="chip ng">not governed</span> ' : ''}${esc(t.data_note || '')}</div>
    ${moreHtml(more)}
    ${t.conflicting_variants ? `<button type="button" class="warnbtn" aria-expanded="false" onclick="toggleVariants(this)">${variantLabel(t)} <span aria-hidden="true">▾</span></button><div class="vdetail" hidden>${variantsHtml(t)}</div>` : ''}</div>`;
}

// Overview: the calm layout of the home page (compact tiles, product chips, the most urgent routes). Charts and Table views stay one click away.
function conflictHtml(t) { return t.conflicting_variants ? `<button type="button" class="warnbtn" aria-expanded="false" onclick="toggleVariants(this)">${variantLabel(t)} <span aria-hidden="true">▾</span></button><div class="vdetail" hidden>${variantsHtml(t)}</div>` : ''; }
const TILE_STRIP = ['#00B3B8', '#4DB8F5', '#5DBB46'];
function otile(t, i) {
  const snap = t.kind === 'snapshot';
  const big = snap ? `${Math.round(t.value)}<small> ${esc(t.value_label || '')}</small>` : fmt(t.value, t.unit);
  return `<div class="otile"><i class="strip" style="background:${snap ? '#C8003F' : TILE_STRIP[i % TILE_STRIP.length]}"></i><div class="label">${esc(t.metric)}</div><div class="num">${big}</div>${deltaHtml(t)}
    ${snap || !(t.series || []).length ? '' : `<div class="mini"><canvas data-i="${i}" data-mini="1" role="img" aria-label="${esc(t.metric)} trend"></canvas></div>`}
    <div class="otag">${t.governed === false ? '<span class="chip ng">not governed</span> ' : ''}${esc(t.origin || '')}</div>${conflictHtml(t)}</div>`;
}
function routeCard(t, i) {
  const base = String(t.metric).replace(' · ' + t.slice, ''), vs = t.series.map(x => x.value);
  const gap = t.target != null ? t.value - t.target : null;
  const take = gap == null ? '' : `${fmt(Math.abs(gap), t.unit === '%' ? 'pts' : t.unit)}${t.unit === '%' ? ' pts' : ' ' + t.unit} ${gap < 0 ? 'below' : 'above'} the ${esc(t.target_label || 'average')}`;
  return `<div class="card redroute"><div class="top"><span class="kpi">${esc(t.slice)}</span></div><div class="subtitle">${esc(base)}, last ${vs.length} months</div>
    <div class="value">${fmt(t.value, t.unit)}</div><div class="cap">${take}</div>
    <div class="chart"><canvas data-i="${i}" role="img" aria-label="${esc(t.metric)}, last ${vs.length} months"></canvas></div></div>`;
}
function overviewHtml(d) {
  const T = d.tiles.map((t, i) => [t, i]);
  const plain = T.filter(([t]) => t.state === 'ready' && !t.risk_status), route = T.filter(([t]) => t.state === 'ready' && t.risk_status), pend = T.filter(([t]) => t.state === 'pending');
  const snap = plain.find(([t]) => t.kind === 'snapshot');
  let h = plain.length ? `<section><div class="otiles">${plain.map(([t, i]) => otile(t, i)).join('')}</div></section>` : '';

      return `<div class="pill" title="${esc(x.label + ': ' + x.red + ' of ' + x.total + ' routes red')}"><i class="dot${lvl}">${['✓', '!', '✕'][lvl]}</i>${esc(x.label)} <small>${Math.round(x.share_pct)}% red</small></div>`; }).join('')}</div>
      <div class="small note">✕ above the share across the whole scope (${Math.round(share)}%), ! some red routes, ✓ none. Red is the data pack's own risk label.</div></section>`;

}
// Switching view redraws the page, so focus goes back to the button that was pressed and the change is announced.
function setView(v) { VIEW = v; render(); $('live').textContent = 'Showing the ' + v + ' view'; document.querySelector('[aria-label="View"] button.on')?.focus(); }
// Comparison: tiles that share a measure but differ by product, market or platform are drawn together in ONE chart.

      return `<div class="cmpcard"><div class="kpi">${esc(x.name)}: ${shown.map(y => esc(y.t.slice)).join(' vs ')}</div><div class="cmpchart"><canvas data-cmp="${k}" role="img" aria-label="${esc(x.name)} compared across ${shown.map(y => esc(y.t.slice)).join(', ')}"></canvas></div>${more > 0 ? `<div class="small">Showing ${shown.length} of ${x.items.length}. The Table view has all of them.</div>` : ''}</div>`; }).join('')}</div></section>`;

  ctx.save(); ctx.font = '800 12px Figtree, system-ui, sans-serif'; ctx.textBaseline = 'middle';

        scales: { y: { grid: { color: '#E8F3FA' }, ticks: { maxTicksLimit: 5, callback: v => CMP_INDEXED ? v : fmt(v, x.unit) } }, x: { grid: { display: false }, ticks: { maxTicksLimit: 5 } } } } }));

// Months are matched by label (tiles have 7 to 10 points), snapshot tiles have categories instead of months and are skipped.
function monthKey(m) { return Date.parse('1 ' + String(m).slice(0, 3) + ' 20' + String(m).slice(-2)); }

  const ready = d.tiles.filter(t => t.state === 'ready' && t.kind !== 'snapshot' && (t.series || []).length); if (!ready.length) return '';

    months.map(m => `<tr><td>${esc(m)}</td>${ready.map((t, j) => `<td>${look[j].has(m) ? ff[j](look[j].get(m)) : '–'}</td>`).join('')}</tr>`).join('') + '</table></div>';

function infoLabel() { return (INFO_OPEN ? 'Hide' : 'Show') + ' ownership and audit log ' + (INFO_OPEN ? '▴' : '▾'); }
function render() {
  charts.forEach(c => c.destroy()); charts = [];

      <div class="scroll"><table class="trail"><tr><th>When</th><th>Who</th><th>What happened</th><th>Hash</th></tr>${AUDIT.entries.map(e => `<tr><td>${esc(e.ts.replace('T', ' ').slice(0, 19))}</td><td>${esc(e.actor)}</td><td><b>${esc(String(e.event).replace(/_/g, ' '))}</b></td><td class="hash">${esc(String(e.hash).slice(0, 12))}…</td></tr>`).join('')}</table></div>

      <div class="role">${esc(c.role)}</div><b>${esc(c.name || 'Nobody recorded')}</b> ${stChip(c.status)}
      <div class="small tight">${esc(c.owner_role || '')}${c.email ? ', ' + esc(c.email) : ''}</div><div class="small tight">${esc(c.why || '')}</div></div>`).join('')}</div>
      <div class="small note">Read from the data pack every time this page opens, so a person who has left is flagged.</div></div>` : '';

          scales: { y: { display: false, min: 0, grace: '15%' }, x: { grid: { display: false }, ticks: { maxRotation: 45, minRotation: 0, font: { size: 11 } } } } } }));

// Next steps: only what people still have to do is counted; what the factory already did is one quiet line. Falls back to the old list for older proposals.
const WHO_LABEL = { requester: 'Whoever runs this request', asset_owner: 'Owner of the existing dashboard', kpi_owner: 'KPI owner', steward: 'Data steward', bi_team: 'BI team', approver: 'Approver' };
const WHO_ORDER = ['requester', 'asset_owner', 'kpi_owner', 'steward', 'bi_team', 'approver'];
function steps(d) { return Array.isArray(d.next_steps) ? { todo: d.next_steps.filter(x => x.status === 'todo'), done: d.next_steps.filter(x => x.status === 'done'), tagged: true }
  : { todo: (d.required_actions || []).map(t => ({ text: t, who: null, status: 'todo' })), done: [], tagged: false }; }

function todoPanel(d) {

    : [['other', st.todo]];
  const body = groups.map(([w, a]) => { const names = ['asset_owner', 'kpi_owner'].includes(w) ? [...new Set(a.map(x => x.who_name).filter(Boolean))] : [];
    return `<div class="stepgrp">${w === 'other' ? '' : `<div class="stepwho">${esc(WHO_LABEL[w])}${names.length ? ': ' + names.map(esc).join(', ') : ''}</div>`}<ul>${a.map(x => `<li>${esc(x.text)}</li>`).join('')}</ul></div>`; }).join('');
  return `<div id="todo" class="todopanel"${TODO_OPEN ? '' : ' hidden'}><h2>Next steps before go-live</h2>
    ${body || '<p style="margin:0">Nothing left for anyone to do.</p>'}
    ${st.done.length ? `<p class="small note"><b>Done by the factory:</b> ${st.done.map(x => esc(x.text)).join(' · ')}</p>` : ''}</div>`;
}
function toggleTodo() {
  TODO_OPEN = !TODO_OPEN; $('todo').hidden = !TODO_OPEN; const b = $('todobtn');
  b.setAttribute('aria-expanded', String(TODO_OPEN)); b.textContent = todoLabel(D);
}
function toggleInfo(forceOpen) {
  INFO_OPEN = forceOpen === true ? true : !INFO_OPEN;
  $('info').hidden = !INFO_OPEN; const b = $('infobtn');
  b.setAttribute('aria-expanded', INFO_OPEN); b.textContent = infoLabel();

}
function load() {
  skeleton();
  const side = u => fetch(u).then(r => r.ok ? r.json() : null).catch(() => null); // who asked + audit trail; page still works without them
  fetch('/api/dashboards/' + encodeURIComponent(pid)).then(async r => {
    const b = await r.json().catch(() => ({}));
    if (!r.ok) { $('title').textContent = 'Dashboard not available'; $('main').innerHTML = `<div class="error"><b>This dashboard could not be opened.</b> ${esc(b.detail || 'The server returned error ' + r.status + '.')} Try again, or open another one from My dashboards. <button onclick="load()">Try again</button></div>`; return; }
    [PROP, AUDIT] = await Promise.all([side('/api/proposals/' + encodeURIComponent(pid)), side('/api/audit?proposal_id=' + encodeURIComponent(pid))]);
    D = b; render();
  }).catch(e => { $('title').textContent = 'Dashboard not available'; $('main').innerHTML = `<div class="error"><b>This dashboard could not be loaded.</b> The server did not answer (${esc(e.message)}). Check that the app is running, then try again. <button onclick="load()">Try again</button></div>`; });
}
