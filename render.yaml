# Render blueprint: New + > Blueprint > pick this repo. Then paste GEMINI_API_KEY in the dashboard (never in git).
services:
  - type: web
    name: analytics-dashboard-factory
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn engine.serve:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/llm-usage
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: GEMINI_API_KEY
        sync: false          # you enter the value in the Render dashboard
      - key: GEMINI_DAILY_CAP
        value: "300"
      - key: RATE_POST_PER_MIN
        value: "20"
